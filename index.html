}

/* Kontrast: Navigationsleiste trägt wieder ihren dunklen Grund */
body>.nav{background:var(--shell);border-bottom:1px solid rgba(255,255,255,.08)}
body>.nav .tab{color:rgba(255,255,255,.78)}
body>.nav .tab:hover{color:#fff;background:rgba(255,255,255,.10)}
body>.nav .tab[aria-selected="true"]{color:#fff}
body>.nav .tab.util{color:rgba(255,255,255,.72)}
/* HUD-Chips mit ausreichendem Eigenkontrast */
.hud .chip{background:rgba(255,255,255,.14);color:rgba(255,255,255,.95)}
.hud .chip b{color:var(--lime)}
/* Lesetexte auf dem hellen Grund */

.v27-path p,.v27-lead>p,.v27-sub p{color:#4B5668}
.v27-today p{color:rgba(255,255,255,.88)}
.v27-today .meta{color:rgba(255,255,255,.76)}
.v27-p2 h3,.v27-p2 .go{color:#0E8C77}
.eyebrow,.v27-strip span{color:#5A6474}

/* Kontrast: feste Chipfarbe statt Transparenz, dunklere Akzente für Fliesstextlinks */
.hud .chip{background:#1B2436;color:#F2F5FA;border:1px solid rgba(255,255,255,.10)}
.hud .chip b{color:#C6FF63}
.v27-path .go{color:#3D4BD1}
.v27-p2 .go{color:#0B7A68}
.v27-p3 .go{color:#6B4FE0}
.v27-p2 h3{color:#0B7A68}
.v27-p3 h3{color:#6B4FE0}
.mn-link,.v27-stop .v27-meta span:last-child{color:#0B7A68}

/* ---------- Nachbesprechung nach einem Test ---------- */
.reviewlist{display:flex;flex-direction:column;gap:14px;margin-bottom:var(--s3)}
.revitem{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--coral);
  border-radius:16px;padding:20px 22px;box-shadow:var(--sh)}
.revno{font:700 12.5px/1.4 var(--f);color:var(--tx3);margin-bottom:9px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.revtag{font:700 11px/1 var(--f);text-transform:uppercase;letter-spacing:.07em;padding:5px 9px;border-radius:99px}
.revtag.wrong{background:var(--coral-w);color:#B23A35}
.revtag.open{background:var(--amber-w);color:#8A5E08}
.revq{font-size:16px;font-weight:700;line-height:1.45;margin-bottom:12px}
.revmine,.revsol{font-size:16px;line-height:1.5;margin-bottom:8px}
.revmine>span,.revsol>span{display:inline-block;min-width:104px;font:700 11px/1 var(--f);
  text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);vertical-align:middle;margin-right:6px}
.revmine{color:#B23A35}
.revsol{color:#0B7A68;font-weight:700}
.revwhy{font-size:15px;line-height:1.6;color:var(--tx2);margin:10px 0 12px;
  padding-left:14px;border-left:2px solid var(--line2);max-width:62ch}

/* ---------- Bilder im Lernstoff ---------- */
.media{margin:0 0 var(--s3);max-width:var(--col)}
.media img{display:block;width:100%;height:auto;border-radius:16px;background:var(--bg2)}
.media figcaption{margin-top:10px;font-size:14px;line-height:1.55;color:var(--tx2)}
.media-cred{display:block;margin-top:5px;font:600 11.5px/1.4 var(--f);color:var(--tx3)}
.media.hero{max-width:520px;margin-top:var(--s2)}
.media.hero img{aspect-ratio:4/3;object-fit:cover;box-shadow:var(--sh)}
.media.hero img[src^="data:image/svg"]{object-fit:contain;padding:22px;background:var(--surface)}
.v27-stop.haspic{padding-left:74px;position:relative}
.stopthumb{position:absolute;left:0;top:2px;width:56px;height:56px;border-radius:12px;
  object-fit:cover;background:var(--surface);border:1px solid var(--line)}
.stopthumb[src^="data:image/svg"]{object-fit:contain;padding:8px}
@media(max-width:760px){.media.hero{max-width:100%}.v27-stop.haspic{padding-left:64px}
  .stopthumb{width:48px;height:48px}}

/* ---------- Bilder gross und weit oben ---------- */
.media.hero{max-width:none;width:100%;margin:var(--s2) 0 var(--s3)}
.media.hero img{width:100%;max-height:340px;aspect-ratio:auto;object-fit:cover;border-radius:20px;
  box-shadow:var(--shx)}
.media.hero img[src^="data:image/svg"]{max-height:260px;object-fit:contain;padding:34px;
  background:linear-gradient(140deg,var(--scw,var(--blue-w)),var(--surface));box-shadow:var(--sh)}
.media.hero figcaption{font-size:15px}
/* Kapitelliste: echte Bildkarten statt Miniaturen */
.v27-stop.haspic{padding-left:0;display:grid;grid-template-columns:132px 1fr;gap:20px;align-items:start}
.stopthumb{position:static;width:132px;height:100px;border-radius:14px;object-fit:cover;
  box-shadow:var(--sh);border:0}
.stopthumb[src^="data:image/svg"]{object-fit:contain;padding:16px;background:var(--surface);
  border:1px solid var(--line)}
.v27-stop.haspic::before{left:-36px}
@media(max-width:760px){
  .media.hero img{max-height:220px}
  .media.hero img[src^="data:image/svg"]{max-height:180px;padding:22px}
  .v27-stop.haspic{grid-template-columns:92px 1fr;gap:14px}
  .stopthumb{width:92px;height:72px}
}

/* Bildkarte: Bild links, alle Texte gestapelt rechts */
.v27-stop.haspic{grid-template-rows:auto;align-items:start}
.v27-stop.haspic > .stopthumb{grid-column:1;grid-row:1 / span 4}
.v27-stop.haspic > :not(.stopthumb){grid-column:2}
.v27-stop.haspic > .no{grid-row:1}
.v27-stop.haspic > h4{grid-row:2;margin-top:2px}
.v27-stop.haspic > .q{grid-row:3}
.v27-stop.haspic > .v27-meta{grid-row:4}
.media-cred.unverified{color:var(--amber)}

/* ---------- Abschlusswahl ---------- */
.v27-sub.prog{cursor:pointer}
.v27-sub.prog.todo{opacity:.92;border-style:dashed}
.v27-sub.prog.on{border-color:var(--sc);box-shadow:var(--shx)}
.progmeta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.badge{font:700 11.5px/1 var(--f);padding:6px 10px;border-radius:99px;background:var(--bg2);color:var(--tx3)}
.badge.ok{background:var(--green-w);color:#0B6B3F}
.badge.todo{background:var(--amber-w);color:#8A5E08}
.progtracks{display:block;font-size:14px;color:var(--tx2);margin-bottom:10px}
.prognote{display:block;font-size:14px;line-height:1.55;color:var(--tx3);
  border-top:1px solid var(--line);padding-top:11px}
.v27-sub.prog{display:flex;flex-direction:column;align-items:flex-start;gap:0;min-height:0}
.v27-sub.prog>*{display:block;width:100%}
.v27-sub.prog .sh{display:flex;align-items:baseline;gap:10px;width:100%}
.v27-sub.prog .sh h3{font-size:18px}
.v27-sub.prog>p{font-size:14px;line-height:1.5;color:var(--tx2);margin:8px 0 0}
.v27-sub.prog .progmeta{display:flex}
.v27-sub.prog{height:auto;max-height:none;overflow:visible;white-space:normal}
.v27-sub.prog .progmeta,.v27-sub.prog .progtracks,.v27-sub.prog .prognote{
  visibility:visible;height:auto;overflow:visible}

/* ---------- Marke, Anspruch und Sprachwahl im Kopf ---------- */
.brandblock{display:flex;flex-direction:column;gap:2px;min-width:0}
.tagline{font:600 12.5px/1.3 var(--f);color:rgba(255,255,255,.62);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:46ch}
.langsw{display:flex;gap:2px;margin-left:18px;background:rgba(255,255,255,.08);
  border-radius:99px;padding:3px}
.lang{font:700 11.5px/1 var(--f);color:rgba(255,255,255,.65);padding:7px 11px;
  border-radius:99px;border:0;background:transparent;cursor:pointer}
.lang:hover{color:#fff}
.lang[aria-current="true"]{background:var(--lime);color:#0B1220}
.freebar{display:flex;flex-direction:column;gap:6px;max-width:var(--col);margin:0 0 var(--s3);
  padding:18px 22px;border-radius:18px;background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--sh)}
.freebar b{font:700 15px/1 var(--f);color:#0B7A68}
.freebar span{font-size:15px;line-height:1.6;color:var(--tx2)}
.freelocal{font:600 12.5px/1.4 var(--f)!important;color:var(--tx3)!important}
@media(max-width:1100px){.tagline{display:none}}
@media(max-width:760px){.langsw{margin-left:auto;padding:2px}.lang{padding:6px 8px;font-size:11.5px}}

/* ---------- Lernziele bearbeiten ---------- */
.goalwrap{display:flex;flex-direction:column;gap:16px;max-width:var(--col)}
.goalcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:22px;box-shadow:var(--sh)}
.glab{display:block;font:700 11px/1 var(--f);text-transform:uppercase;letter-spacing:.08em;
  color:var(--sc,var(--blue));margin:14px 0 6px}
.goalcard .glab:first-child{margin-top:0}
.gin{width:100%;font:400 16px/1.55 var(--f);color:var(--ink);background:var(--bg2);
  border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;resize:vertical}
.gin:focus{outline:2px solid var(--sc,var(--blue));outline-offset:1px;background:#fff}
.gsaved{font:700 12.5px/1 var(--f);color:#0B7A68;align-self:center}

/* ---------- Lernziel, Plan, Abschluss-Dashboard ---------- */
.ocgrid{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:start}
.occard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--sh)}
.occard.official{border-left:4px solid var(--blue)}
.occard.personal{border-left:4px solid var(--teal)}
.ocnote{font:600 12.5px/1.5 var(--f);color:var(--tx3);margin-bottom:16px}
.oclab{font:700 11px/1 var(--f);text-transform:uppercase;letter-spacing:.09em;color:var(--blue);margin:16px 0 6px}
.oclab:first-of-type{margin-top:0}
.occard p{font-size:16px;line-height:1.6;color:var(--tx2);margin:0}
.ocpers{font:700 18px/1 var(--f);color:var(--teal);margin-bottom:14px}
.ocimpact{margin-top:14px;font:700 14px/1.5 var(--f);color:#0B7A68}
.planlist{display:flex;flex-direction:column;gap:8px;max-width:var(--col)}
.planrow{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 18px;cursor:pointer}
.planrow:hover{border-color:var(--sc)}
.planrow.on{border-left:3px solid var(--teal)}
.planpri{grid-row:1/3;align-self:center;font:700 11px/1 var(--f);text-transform:uppercase;
  padding:7px 11px;border-radius:99px;background:var(--bg2);color:var(--tx3)}
.planpri.p2{background:var(--amber-w);color:#8A5E08}
.planpri.p3{background:var(--coral-w);color:#B23A35}
.plantitle{font:700 16px/1.35 var(--f)}
.planmeta{font:600 12.5px/1.4 var(--f);color:var(--tx3)}
.warnbox{max-width:var(--col);background:var(--amber-w);border-left:4px solid var(--amber);
  border-radius:14px;padding:18px 20px;font-size:15px;line-height:1.6;color:#6B4A06;margin-bottom:var(--s3)}
@media(max-width:900px){.ocgrid{grid-template-columns:1fr}}
.langwrap{display:flex;align-items:center;gap:8px;margin-left:16px}
.langlab,.langcontent{font:600 11px/1 var(--f);color:rgba(255,255,255,.5);white-space:nowrap}
.langcontent{color:var(--amber);opacity:.85}
.langsw{margin-left:0}
@media(max-width:1280px){.langlab{display:none}}
@media(max-width:900px){.langcontent{display:none}}
.progpill{margin-left:14px;background:rgba(184,255,74,.14);color:var(--lime);border:1px solid rgba(184,255,74,.35);
  font:700 12.5px/1 var(--f);padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap}
.progpill:hover{background:rgba(184,255,74,.24)}
#buildstamp{font-family:var(--fm);font-size:11.5px;color:var(--tx3)}
@media(max-width:900px){.progpill{font-size:11.5px;padding:6px 10px;margin-left:8px}}

/* ---------- Abschluss-Dashboard mit unabhängigen Dimensionen ---------- */
.dimrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:var(--s2)}
.dim{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--tx3);
  border-radius:14px;padding:14px 16px}
.dim.ok{border-left-color:#0B7A68}
.dim.warn{border-left-color:var(--amber)}
.dim b{display:block;font:700 11px/1 var(--f);text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);margin-bottom:6px}
.dim span{font:700 14px/1.4 var(--f);color:var(--ink)}
.dsec{margin-top:var(--s4)}
.dtext{font-size:16px;line-height:1.6;color:var(--tx2);max-width:var(--col);margin-bottom:var(--s2)}
.dtext.warnt{color:#6B4A06;background:var(--amber-w);border-left:3px solid var(--amber);
  padding:14px 18px;border-radius:12px}
.dtext.small{font-size:14px;color:var(--tx3)}
.trkrow{display:flex;gap:16px;align-items:flex-start;margin-bottom:12px;flex-wrap:wrap}
.trklab{font:700 11px/1 var(--f);text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);
  min-width:120px;padding-top:9px}
.trkopts{display:flex;gap:7px;flex-wrap:wrap;flex:1}
.trk{font:600 12.5px/1 var(--f);color:var(--tx2);background:var(--surface);border:1.5px solid var(--line);
  padding:9px 14px;border-radius:99px;cursor:pointer}
.trk:hover{border-color:var(--sc)}
.trk.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* Lange Abschlussnamen dürfen die Seite nicht aufziehen */
.vhead h1,.dsec h2,.plantitle,.v27-sub h3{overflow-wrap:anywhere;hyphens:auto}
.progpill{max-width:34vw;overflow:hidden;text-overflow:ellipsis}
.dim span,.dtext{overflow-wrap:anywhere}
@media(max-width:760px){
  .vhead h1{font-size:clamp(21px,6.6vw,26px)}
  .progpill{max-width:40vw}
  .trklab{min-width:0}
  .trk{max-width:100%;overflow-wrap:anywhere;text-align:left}
}

/* ============================================================
   Eine Zeile. Kein zweiter Navigationsstreifen. Ein Regler statt vier Chips.
   ============================================================ */
body>.top{position:fixed;top:0;left:0;right:0;height:var(--shell-h);z-index:60;
  background:var(--shell);border-bottom:1px solid rgba(255,255,255,.08)}
body>.top .top-in{max-width:var(--wrap);height:var(--shell-h);margin:0 auto;padding:0 24px;
  display:flex;align-items:center;gap:14px;flex-wrap:nowrap;white-space:nowrap}
body>.nav,body>.top .nav{position:static;top:auto;bottom:auto;background:transparent;border:0;
  box-shadow:none;margin:0 auto;z-index:auto;flex:0 1 auto;min-width:0}
body>.top .nav .nav-in{display:flex;gap:2px;padding:0;max-width:none;justify-content:center}
body{padding-top:var(--shell-h);padding-bottom:0}
main{padding-top:var(--s4)}
html{scroll-padding-top:calc(var(--shell-h) + 18px)}
.readypill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);border-radius:99px;padding:6px 14px 6px 8px;cursor:pointer;flex:0 0 auto}
.readypill:hover{background:rgba(255,255,255,.13)}
.rdring{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--lime) 0deg,rgba(255,255,255,.14) 0);
  position:relative;flex:0 0 auto}
.rdring::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--shell)}
.rdnum{font:700 12.5px/1 var(--fm);color:#fff}
.menubtn{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.8);display:grid;place-items:center;
  cursor:pointer;flex:0 0 auto}
.menubtn svg{width:19px;height:19px}
.menubtn:hover{color:#fff;background:rgba(255,255,255,.14)}
.readypop,.menupop{position:absolute;right:24px;top:calc(var(--shell-h) - 6px);z-index:61;
  background:var(--shell);border:1px solid rgba(255,255,255,.14);border-radius:16px;
  padding:12px;min-width:250px;box-shadow:0 26px 60px -20px rgba(0,0,0,.7);
  max-height:calc(100dvh - var(--shell-h) - 96px - env(safe-area-inset-bottom,0px));overflow-y:auto;overscroll-behavior:contain}
.readypop[hidden],.menupop[hidden]{display:none}
.rdrow{display:flex;align-items:baseline;gap:10px;padding:8px 10px;border-radius:10px}
.rdrow b{font:700 18px/1 var(--f);color:var(--lime);min-width:52px}
.rdrow span{font:600 12.5px/1.3 var(--f);color:rgba(255,255,255,.72)}
.mp{display:block;width:100%;text-align:left;font:600 15px/1 var(--f);color:rgba(255,255,255,.86);
  padding:12px 12px;border-radius:10px;background:none;border:0;cursor:pointer}
.mp:hover{background:rgba(255,255,255,.1);color:#fff}
.mplang{border-top:1px solid rgba(255,255,255,.12);margin-top:8px;padding:12px;display:flex;
  flex-direction:column;gap:8px}
.mplang .langsw{display:inline-flex;gap:2px;background:rgba(255,255,255,.08);border-radius:99px;padding:3px;align-self:flex-start}
.hud,.langwrap{display:none!important}
@media(max-width:1180px){body>.top .tagline{display:none}}
@media(max-width:1000px){body>.top .tab span:not(.tab-ic):not(.dot){display:none}
  body>.top .tab{padding:10px 12px}}
@media(max-width:760px){
  body>.top .nav{position:fixed;left:0;right:0;bottom:0;top:auto;background:rgba(11,18,32,.97);
    backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.09);z-index:55;
    padding-bottom:env(safe-area-inset-bottom);margin:0}
  body>.top .nav .nav-in{justify-content:space-around;padding:7px 4px}
  body>.top .tab{flex-direction:column;gap:3px;font-size:11px;min-width:52px;padding:7px 4px}
  body>.top .tab span:not(.tab-ic):not(.dot){display:block}
  body>.top .tab[aria-selected="true"]::after{display:none}
  body>.top .tab[aria-selected="true"]{color:var(--lime)}
  body{padding-bottom:66px}
  .readypop,.menupop{right:12px;left:12px;min-width:0}
}

/* Kein abgeschnittener Text in der Leiste */
body>.top .tagline{display:none}                 /* steht vollständig auf der Startseite */
body>.top .progpill{max-width:none;overflow:visible;text-overflow:clip}
body>.top .logo{flex:0 0 auto}
body>.top .brandblock{flex:0 0 auto}
@media(max-width:760px){body>.top .progpill{max-width:44vw;overflow:hidden;text-overflow:ellipsis}}

/* Mobil: Markenzeile oben sichtbar, Navigation unten fest */
@media(max-width:760px){
  body>.top{height:var(--shell-h);overflow:visible}
  body>.top .top-in{display:flex!important;height:var(--shell-h);padding:0 12px;gap:8px}
  body>.top .brandblock,body>.top .progpill,body>.top .readypill,body>.top .menubtn{display:flex!important}
  body>.top .nav{position:fixed!important;left:0;right:0;bottom:0;top:auto!important;
    height:auto;background:rgba(11,18,32,.98);border-top:1px solid rgba(255,255,255,.1);
    z-index:56;margin:0!important;flex:none}
  body>.top .nav .nav-in{height:auto;justify-content:space-around;padding:7px 2px;gap:0}
  body>.top .logo{font-size:16px}
  body>.top .logo i{width:26px;height:26px}
  body>.top .progpill{font-size:11.5px;padding:6px 10px}
  body>.top .readypill{padding:5px 10px 5px 6px}
  body>.top .menubtn{width:34px;height:34px}
}

/* Navigation unten: höchste Spezifität, damit keine frühere Regel gewinnt */
@media(max-width:760px){
  html body header.top nav.nav{position:fixed!important;inset:auto 0 0 0!important;
    top:auto!important;height:auto!important;transform:none!important}
}

body>.top{backdrop-filter:none!important;filter:none!important;transform:none!important}

/* ---------- Lehrgang je Fach ---------- */
.curgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.curcard{display:flex;flex-direction:column;gap:9px;text-align:left;width:100%;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tx3);
  border-radius:16px;padding:18px 20px;box-shadow:var(--sh)}
.curcard:hover{transform:translateY(-2px);box-shadow:var(--shx)}
.curcard.r-core{border-left-color:var(--blue)}
.curcard.r-focus{border-left-color:var(--teal)}
.curcard.r-support{border-left-color:var(--tx3)}
.curtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.curtop svg{width:22px;height:22px;color:var(--sc)}
.curtop b{font:700 18px/1.2 var(--f)}
.curbadge{font:700 11px/1 var(--f);text-transform:uppercase;letter-spacing:.07em;
  padding:5px 9px;border-radius:99px;background:var(--bg2);color:var(--tx3);margin-left:auto}
.curcard.r-core .curbadge{background:var(--blue-w);color:#3D4BD1}
.curcard.r-focus .curbadge{background:var(--teal-w);color:#0B7A68}
.curdepth{display:flex;align-items:center;gap:6px}
.curdepth i{width:26px;height:5px;border-radius:99px;background:rgba(16,23,36,.12)}
.curdepth i.on{background:var(--sc)}
.curdepth span{font:700 11.5px/1 var(--f);color:var(--tx3);margin-left:5px}
.curnote{font-size:14px;line-height:1.5;color:var(--tx2)}

.mnbg-m{position:absolute;width:var(--sz);height:var(--sz);color:#4f7cff;opacity:.13;
 transform:rotate(var(--rot));animation:mnbgDrift 64s ease-in-out infinite;
 animation-delay:var(--d)}
.mnbg-m svg{width:100%;height:100%;display:block}
.mnbg-m.m1,.mnbg-m.m4,.mnbg-m.m6{animation-name:mnbgDrift2;animation-duration:82s}
.mnbg-m.m2,.mnbg-m.m5{animation-duration:73s}
@keyframes mnbgDrift{
  0%{transform:rotate(var(--rot)) translate3d(0,0,0) scale(1);opacity:.10}
  25%{transform:rotate(calc(var(--rot) + 14deg)) translate3d(7vw,-5vh,0) scale(1.22);opacity:.19}
  50%{transform:rotate(calc(var(--rot) - 10deg)) translate3d(-5vw,7vh,0) scale(.88);opacity:.11}
  75%{transform:rotate(calc(var(--rot) + 8deg)) translate3d(4vw,4vh,0) scale(1.14);opacity:.17}
  100%{transform:rotate(var(--rot)) translate3d(0,0,0) scale(1);opacity:.10}}
@keyframes mnbgDrift2{
  0%{transform:rotate(var(--rot)) translate3d(0,0,0) scale(1);opacity:.11}
  33%{transform:rotate(calc(var(--rot) - 16deg)) translate3d(-6vw,6vh,0) scale(1.26);opacity:.20}
  66%{transform:rotate(calc(var(--rot) + 12deg)) translate3d(6vw,-6vh,0) scale(.86);opacity:.12}
  100%{transform:rotate(var(--rot)) translate3d(0,0,0) scale(1);opacity:.11}}

/* ============================================================
   Kopfzeile aufgeräumt. Der Infostreifen mit Tagen und Modulen
   stand mitten in der Navigation, und der Reiter Abdeckung lag
   unter dem Fortschrittsring. Beides hat jetzt seinen Platz.
   ============================================================ */
/* Der Infostreifen gehört nicht zwischen Marke und Navigation. */
#mn-headinfo,.hdinfo{display:none!important}

html body header.top .top-in{
 display:flex!important;align-items:center;gap:14px;
 padding:0 clamp(14px,2vw,26px);flex-wrap:nowrap;min-width:0}
html body header.top .brandblock{flex:0 0 auto}
html body header.top .progpill{flex:0 0 auto;white-space:nowrap}
html body header.top .nav{flex:1 1 auto;min-width:0;display:flex;justify-content:center}
html body header.top .nav-in{display:flex;gap:2px;flex-wrap:nowrap;max-width:100%}
html body header.top .tab{flex:0 0 auto;white-space:nowrap}
/* Ring und Menü ganz rechts, mit garantiertem Abstand zur Navigation. */
html body header.top .readypill,html body header.top .menubtn{flex:0 0 auto}
html body header.top .readypill{margin-left:10px}

/* Reiterbeschriftungen verschwinden früh genug, damit nichts kollidiert. */
@media(max-width:1600px){
 html body header.top .tab span:not(.tab-ic):not(.dot){
  position:absolute!important;width:1px;height:1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap}
 html body header.top .tab{padding:10px 11px}
 html body header.top .tab-ic{font-size:16px}
}
@media(max-width:1120px){html body header.top .readypill{display:none}}

/* ============================================================
   Matrix: Spaltenköpfe vollständig, nicht abgeschnitten.
   ============================================================ */
.cv-t thead th,.cv-t tr:first-child th{
 white-space:normal!important;overflow:visible!important;text-overflow:clip!important;
 vertical-align:bottom;line-height:1.25;font-size:12.5px;padding:12px 8px;
 hyphens:auto;overflow-wrap:break-word}
.cv-t th abbr{text-decoration:none;border:0;white-space:normal;display:block}
.cv-t{table-layout:auto}
.cv-corner,.cv-sub{min-width:160px;white-space:normal}
.cv-t td{white-space:nowrap}
@media(max-width:900px){
 .cv-t thead th,.cv-t tr:first-child th{font-size:11.5px;padding:10px 6px}
 .cv-corner,.cv-sub{min-width:130px}
}
.cvh{display:block;font-weight:700;line-height:1.25;max-width:132px;margin:0 auto}
/* ============================================================
   Lesbarkeit vor Zurückhaltung.
   Gemessen wurden 117 Stellen unter dem Mindestkontrast nach
   WCAG 2.2 AA. Ursache waren wenige zu helle Farbtoken für
   Nebentext und dunkler Text auf dunklen Flächen.
   Diese Werte sind gegen Weiss und gegen die dunkle Fläche
   nachgerechnet, nicht geschätzt.
   ============================================================ */
:root{
 --tx1:#101724;          /* 16.1:1 auf Weiss */
 --tx2:#39414F;          /*  9.6:1 */
 --tx3:#565E6C;          /*  6.3:1  war zu hell */
 --tx4:#5F6775;          /*  5.6:1  kleinster erlaubter Nebenton */
 --ink:#101724;
 --line:rgba(16,23,36,.16);
 --muted:#565E6C;
}
/* Jeder Nebentext bekommt den geprüften Ton. */
.tx3,.muted,.sub,.hint,.meta,.cap,.note,.small,
dt,.fmt,.lnk,.media-cred,.lvx-sub,.cv-lead,.vx-lead,.rt-cnt,
.mnf-note,.cv-tot span,.vx-stats span,.vc-meta,.freelocal,
figcaption,.q-meta,.chip,.tag{color:var(--tx3)!important}
/* Etiketten in Grossbuchstaben sind klein, deshalb noch dunkler. */
dt,.kick,.eyebrow,[class*="kick"],[class*="label"]{color:var(--tx2)!important}

/* Dunkle Flächen: heller Text, nie dunkelgrau auf dunkelblau. */
.mission,.missions,.tagesmissionen,[class*="mission"],
.panel-dark,.dark,.vhome.dark,.hero-dark,
[style*="background:#2"],[style*="background:#1"]{color:#F2F4F8}
.mission *,.missions *,[class*="mission"] *{color:inherit}
.mission h2,.mission h3,.missions h2,.missions h3,
[class*="mission"] h2,[class*="mission"] h3{color:#FFFFFF!important}
.mission .sub,.mission .meta,.missions .sub,.missions .meta,
[class*="mission"] .sub,[class*="mission"] .meta,
[class*="mission"] small,[class*="mission"] .muted{color:#C7CEDB!important}
/* Karten in einer dunklen Fläche brauchen genug Abstand zum Grund. */
[class*="mission"] .card,[class*="mission"] > div > div{
 background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16)}
[class*="mission"] button{color:#0B1220}
[class*="mission"] button.ghost,[class*="mission"] button[class*="sec"]{
 background:rgba(255,255,255,.14);color:#FFFFFF;border-color:rgba(255,255,255,.28)}

/* Die Fusszeile ist dunkel: dort gilt der helle Satz. */
.mnf,.mnf *{color:rgba(255,255,255,.82)}
.mnf b,.mnf h4,.mnf .mnf-brand b{color:#FFFFFF}
.mnf-note,.mnf-src,.mnf-build,.mnf-cr,.mnf-col span{color:rgba(255,255,255,.72)!important}
.mnf-col button{color:#FFFFFF!important}

/* Knöpfe: Text auf Fläche, beides geprüft. */
.btn,button.btn,.vx-go,.vhome-go,.mx-start{color:#FFFFFF}
.btn.ghost,.btn-sec,.vhome-act button:not(.vhome-go),
.nl-act button:not(:first-child),.lv-btns button:not(:first-child){
 color:var(--tx1)!important;border-color:var(--tx1)}
/* Grün auf Weiss ist schwach, Grün auf Dunkel ist stark. */
.lime,.accent-lime,[style*="B8FF4A"]{color:#0B1220}
a,.lnk,.link{color:#2B3AC4}
a:hover{color:#101724}
/* Zustandsfarben mit ausreichendem Kontrast. */
.ok,.is-ok,.good{color:#0A6B5B}
.no,.is-no,.bad,.warn{color:#9E2F2A}
/* Restliche Stellen: Knopftexte und Verweise.
   Ein Knopf mit hellem Rahmen und hellem Text ist kein Knopf,
   sondern ein Rätsel. */
button,.btn,[role="button"]{color:var(--tx1,#101724)}
/* Sekundäre Knöpfe: dunkler Text auf heller Fläche. */
button.btn:not(.go):not(.primary):not(.vx-go):not(.vhome-go),
.btn.sm,.btn.ghost,.t-entfernt-btn,#skip,#quit,#flag,
.vc-skip,.vc-show,.vc-no,.vc-again,.bo-again,.rt-open,
.mnc-no,.mnl-nav,.vx-l,.lvx-go,.vc-let,.vc-bclear{
 background:#FFFFFF;color:#101724!important;border:1.5px solid rgba(16,23,36,.30)}
button.btn:not(.go):not(.primary):hover,.btn.sm:hover,.t-entfernt-btn:hover{
 border-color:#101724;background:#F4F5F8}
/* Hauptknöpfe: weisser Text auf dunkler Fläche. */
.btn.go,.btn.primary,.vx-go,.vhome-go,.mx-start,.vc-check,.vc-yes,
.mnc-yes,.rt-o.is-ok,#ok,#submit,.vc-bcheck{
 background:#101724!important;color:#FFFFFF!important;border-color:#101724}
/* Vorlesen und Abschnittsteuerung standen weiss auf weiss. */
[class*="tts"] button,.lctl button,.readbar button,
.vc-play,.lstate{color:#101724!important;background:#FFFFFF;
 border:1.5px solid rgba(16,23,36,.30)}
.lstate{background:rgba(16,23,36,.06);border:0}
/* Verweise: kräftiges Blau, auch auf hellem Grund. */
a,a:link,a:visited,.cv-src a,.mnl-body a{color:#1F2DB0!important;text-decoration:underline}
a:hover{color:#101724!important}
/* Kapitelmission: weisse Schrift auf der dunklen Fläche. */
[class*="mission"] b,[class*="mission"] strong{color:#FFFFFF!important}
/* Aufklappbares */
summary{color:var(--tx1,#101724)!important}
/* Die letzten sechs Stellen, jede einzeln nachgerechnet. */
/* Auf der dunklen Empfehlungskarte muss alles hell sein. */
.dark .eyebrow,.dark .meta,[class*="reco"] .eyebrow,[class*="reco"] .meta,
[style*="background:#0"] .eyebrow,[style*="background:#0"] .meta{
 color:#C7CEDB!important}
.eyebrow{color:#0A6B5B!important}
.meta{color:var(--tx3,#565E6C)!important}
/* Farbige Etiketten auf hellem Grund: dunkler Ton, heller Hintergrund. */
.kernprinzip,span.kernprinzip,.ex-mode,
[class*="prinzip"],[class*="ex-mode"]{
 color:#1F2DB0!important;background:rgba(31,45,176,.10);
 padding:4px 9px;border-radius:99px;display:inline-block}
strong,b{color:inherit}
.mistake strong,[class*="fehl"] strong,[class*="mistake"] strong{color:#8F2722!important}
/* Kapitelmission: dunkle Fläche, also weisse Schrift, ohne Ausnahme. */
[class*="mission"],[class*="mission"] *{color:#FFFFFF!important}
[class*="mission"] .sub,[class*="mission"] .meta,
[class*="mission"] small{color:#CBD3E1!important}
[class*="mission"] button:not(.ghost){background:#B8FF4A!important;color:#0B1220!important}
/* Die letzten sechs, jetzt an der richtigen Stelle.
   Eine davon hatte ich selbst verursacht: die Regel für dunkle
   Missionsflächen traf auch eine helle grüne Karte und schrieb
   dort weiss auf hellgrün. */
[class*="mission"],[class*="mission"] *{color:inherit!important}

/* v27-today ist dunkel (#0B1220): heller Satz. */
.v27-today,.v27-today *{color:#E6EAF2!important}
.v27-today .eyebrow{color:#B8FF4A!important}
.v27-today .meta,.v27-today small{color:#B6BFCE!important}
.v27-today h2,.v27-today h3,.v27-today b{color:#FFFFFF!important}
.v27-today button{background:#B8FF4A!important;color:#0B1220!important}

/* Helle grüne Karte: dunkler Satz, kein Weiss. */
.corepx,.corepx *{color:#0B3B2A!important}
.corepx span,.corepx .lbl{color:#0A5C42!important;font-weight:700}
div:has(> b):is([style*="E5F6EC"]),[style*="rgb(229, 246, 236)"]{color:#0B3B2A!important}
[style*="229, 246, 236"] b,[style*="229, 246, 236"] span{color:#0B3B2A!important}

/* Hinweis unter dem Einrichtungsknopf. */

/* R1 Wiederherstellung: v47 dämpfte die Hintergrundebene mit opacity:.16 auf rund
   ein Sechstel; die animierten Formen waren praktisch unsichtbar. Freigegebener
   Stand: volle Deckkraft der Ebene (die Formen selbst bleiben bei 0.10-0.13). */
#mn-bg,.mnbg{opacity:1!important}
/* R8 Wiederherstellung, gemessene Werte des freigegebenen Stands.
   1. Wortmarke im Kopf weiss. Eine allgemeine v47-Regel für [role=button]
      färbte das anklickbare Logo dunkel auf dunklem Kopf.
   2. Pfadzeile wie freigegeben: ruhig im Fluss, ohne Tönung und Unschärfe. */
header.top .brandblock .logo,header.top .brandblock .logo[role="button"]{color:#fff}

#gl-tip.on{opacity:1}

/* Aus dem gelieferten Paket übernommen: mentor-ui.css (unverändert) */
/* Stoffknacker Top 5 mentor cards. No overlays, no cropping, no line clamps. */
.mn-mentor-slot{width:100%;max-width:860px;margin:20px 0}
.mn-mentor-card{--mentor-accent:#6474FF;display:grid;grid-template-columns:minmax(112px,180px) minmax(0,1fr);gap:20px;align-items:center;background:#fff;border:1px solid rgba(16,23,36,.12);border-left:4px solid var(--mentor-accent);border-radius:18px;padding:18px 20px;box-shadow:0 12px 34px -30px rgba(16,23,36,.55);overflow:visible}
.mn-mentor-card--prominent{grid-template-columns:minmax(150px,220px) minmax(0,1fr);padding:22px 24px}
.mn-mentor-media{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:visible;min-width:0}
.mn-mentor-media img{display:block;width:100%;height:100%;object-fit:contain;object-position:center;max-width:220px;max-height:220px}
.mn-mentor-copy{min-width:0}
.mn-mentor-meta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.mn-mentor-name{font-weight:700;font-size:15px;color:#101724}
.mn-mentor-role{font-size:12.5px;color:#6B7486}
.mn-mentor-copy h3{font-size:18px;line-height:1.25;margin:0 0 7px;color:#101724}
.mn-mentor-copy p{font-size:16px;line-height:1.65;margin:0;color:#4B5668;white-space:normal;overflow:visible;display:block;-webkit-line-clamp:unset;line-clamp:unset}
.mn-mentor-action{margin-top:13px;min-height:42px;padding:9px 14px;border:1px solid rgba(16,23,36,.18);border-radius:10px;background:#fff;color:#101724;font:700 14px/1.2 system-ui,sans-serif;cursor:pointer}
.mn-mentor-action:hover{border-color:var(--mentor-accent);color:var(--mentor-accent)}
@media(max-width:640px){.mn-mentor-card,.mn-mentor-card--prominent{grid-template-columns:104px minmax(0,1fr);gap:14px;padding:14px}.mn-mentor-media img{max-width:120px;max-height:120px}.mn-mentor-copy h3{font-size:16px}.mn-mentor-copy p{font-size:14px;line-height:1.55}.mn-mentor-role{display:block;width:100%}}
@media(max-width:420px){.mn-mentor-card,.mn-mentor-card--prominent{grid-template-columns:88px minmax(0,1fr)}.mn-mentor-media img{max-width:104px;max-height:104px}}

/* Ergänzung: bei fehlenden Bilddateien bleibt die Karte lesbar, ohne leeren Bildplatz */
.mn-mentor-card[data-bild="fehlt"]{grid-template-columns:minmax(0,1fr)}
.mn-mentor-card[data-bild="fehlt"] .mn-mentor-media{display:none}
@media print{.mn-mentor-slot{display:none!important}}

/* Kleines Fachporträt auf den Fachkarten: kennzeichnet die zuständige Lehrperson, ohne Text zu verdecken */
.mn-fachfigur{width:44px;height:44px;object-fit:contain;flex:0 0 auto;margin-left:auto;border-radius:12px;background:rgba(100,116,255,.06)}

/* Empfehlungskasten: schmale Spalte, deshalb Bild oben und Text darunter, nichts wird gequetscht */
.v27-today .mn-mentor-slot{max-width:none;margin:14px 0 0}
.v27-today .mn-mentor-card,.v27-today .mn-mentor-card--prominent{grid-template-columns:minmax(0,1fr);gap:10px;padding:14px;justify-items:start}

/* Keine Breitenregel nach Fenstergrösse: massgeblich ist die schmale Spalte, nicht der Bildschirm. */

</style></head><body><noscript><main style="max-width:760px;margin:24px auto;padding:0 16px;font-family:system-ui,sans-serif;line-height:1.6"><h1>Stoffknacker – kostenlos lernen für Schweizer Abschlüsse</h1><p>Kostenloser Lern- und Prüfungstrainer für Schweizer Abschlüsse: eigene Lektionen Schritt für Schritt, Übungsfragen mit Lösungsweg, Lernpfad und KI-Lernhilfe. Ohne Konto, Lernstand bleibt auf deinem Gerät.</p><h2>Abschlüsse</h2><ul><li><b>Passerelle (Ergänzungsprüfung)</b>: Mit Berufs- oder Fachmaturität an die Universität: Mathematik, Naturwissenschaften, Geschichte, Geografie, Deutsch und zweite Sprache.</li><li><b>Gymnasiale Maturität</b>: Lernen für das Gymnasium nach dem Rahmenlehrplan 2024.</li><li><b>Schweizerische Maturitätsprüfung (SMP)</b>: Externe Maturität: alle Prüfungsfächer nach den Richtlinien.</li><li><b>Berufsmaturität (BM)</b>: Berufsmaturität während oder nach der Lehre, alle Ausrichtungen nach dem Rahmenlehrplan 2025.</li><li><b>Eidgenössische Berufsmaturitätsprüfung (EBMP)</b>: Externe Berufsmaturität, Richtlinien ab 2027 und Übergangsregelung.</li><li><b>Fachmittelschule und Fachmaturität (FMS)</b>: Allgemeinbildung und Berufsfelder nach dem Rahmenlehrplan.</li></ul><h2>So lernst du mit Stoffknacker</h2><ul><li>eigene Lektionen Schritt für Schritt: Erklärung, Schaubild, Beispiel, typischer Fehler, Merksatz.</li><li>Geführt lernen in kleinen Schritten, Übungsfragen mit Lösungsweg, Probetest und Übungsprüfung.</li><li>Lehrplan-Abgleich: die Lernziele der amtlichen Dokumente mit Fundstelle und Stand.</li></ul><p><a href="passerelle/">Passerelle (Ergänzungsprüfung)</a> · <a href="gymnasiale-maturitaet/">Gymnasiale Maturität</a> · <a href="smp/">Schweizerische Maturitätsprüfung (SMP)</a> · <a href="berufsmaturitaet/">Berufsmaturität (BM)</a> · <a href="ebmp/">Eidgenössische Berufsmaturitätsprüfung (EBMP)</a> · <a href="fms/">Fachmittelschule (FMS)</a> · <a href="sprachtrainer/">Sprachtrainer</a></p><p><a href="ueber/">Über Stoffknacker: Gesprä
