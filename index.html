<style>
/* Stoffknacker — helles, freundliches Design.
   Weisser Grund, weiche Karten, ruhige Farben. Die Farbe trägt Bedeutung:
   Blau erklärt, Grün bestätigt, Bernstein warnt, Koralle korrigiert. */
:root{
  --tx2:#4B5668;--tx3:#6B7486

  --shell-h:72px;
  --shell:#0B1220; --canvas:#F3F1EA; --surface:#FCFBF7;
  --lime:#B8FF4A; --blue:#6474FF; --teal:#1AC4A7; --violet:#8468FF;
  --ink:#101724; --tx:#101724; --tx2:#596477; --tx3:#8A93A3;
  --bg:#F3F1EA; --bg2:#EDEBE3; --bg3:#E4E1D8;
  --line:rgba(16,23,36,.10); --line2:rgba(16,23,36,.18);
  --blue-d:#3f4ee0; --blue-w:#E9ECFF; --teal-w:#E2F7F3; --green:#1d9a5f; --green-w:#E4F6EC;
  --amber:#A8740B; --amber-w:#FBF0DA; --coral:#E0554F; --coral-w:#FCEBEA;
  --violet-w:#EFEAFD; --sc:#6474FF; --scw:#E9ECFF;
  --r:18px; --r2:12px; --shell-h:72px; --wrap:1240px;
  --sh:0 1px 2px rgba(16,23,36,.05), 0 14px 36px -26px rgba(16,23,36,.40);
  --shx:0 2px 8px rgba(16,23,36,.06), 0 30px 70px -36px rgba(16,23,36,.5);
  --s1:8px; --s2:16px; --s3:24px; --s4:40px; --s5:64px;
  --col:70ch; --main:800px; --rail:280px;
  --f:"Public Sans",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --fm:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.62 var(--f);overflow-x:hidden}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.018em;line-height:1.22}
p{margin:0 0 .85em}
a{color:var(--blue)}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- chrome ---------- */
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);
  border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;letter-spacing:-.03em}
.logo i{width:28px;height:28px;border-radius:9px;background:linear-gradient(140deg,var(--blue),var(--teal));
  display:grid;place-items:center;font:700 14px/1 var(--f);color:#fff;font-style:normal}
.hud{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{display:flex;align-items:center;gap:5px;border-radius:99px;padding:5px 11px;
  font:700 12.5px/1 var(--f);font-variant-numeric:tabular-nums;white-space:nowrap;border:1px solid transparent}
.chip.volt{background:var(--green-w);color:var(--green)}
.chip.gold{background:var(--amber-w);color:var(--amber)}
.chip.hot{background:var(--coral-w);color:var(--coral)}
.chip.cy{background:var(--blue-w);color:var(--blue)}
.nav::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:2.5px solid transparent;padding:12px 12px 10px;font-size:14px;
  font-weight:600;color:var(--tx3);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--tx)}
.tab[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue)}
.tab .dot{display:inline-block;min-width:18px;margin-left:6px;padding:1px 6px;border-radius:99px;
  background:var(--coral);color:#fff;font:700 11px/1.6 var(--f);text-align:center}
main{max-width:1080px;margin:0 auto;padding:22px 16px 90px}
.view[hidden]{display:none}

.xpbar{height:9px;background:var(--bg3);border-radius:99px;overflow:hidden}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));
  border-radius:99px;transition:width .5s}
.lvl{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.lvl b{font:700 16px/1 var(--f)}
.lvl span{margin-left:auto;font:700 12.5px/1 var(--f);color:var(--tx3);font-variant-numeric:tabular-nums}

/* ---------- cards ---------- */
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card.glow{border-color:#c9dcff;background:linear-gradient(180deg,#f6f9ff,#fff)}
.grid{display:grid;gap:13px}
.g2{grid-template-columns:repeat(auto-fit,minmax(255px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(185px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:13px}
.muted{color:var(--tx3)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}

.btn{background:var(--bg);border:1.5px solid var(--line2);color:var(--tx);padding:11px 17px;border-radius:var(--r2);
  cursor:pointer;font-size:14px;font-weight:600;transition:transform .08s,border-color .15s,background .15s}
.btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-w)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.go{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700;box-shadow:0 2px 8px -2px rgba(47,109,240,.5)}
.btn.go:hover{background:var(--blue-d);border-color:var(--blue-d);color:#fff}
.btn.sm{padding:8px 12px;font-size:12.5px}
.btn.ghost{background:none}
.btn.wide{width:100%}

.tag{display:inline-block;padding:3px 10px;border-radius:99px;font:700 11.5px/1.5 var(--f);
  background:var(--bg3);color:var(--tx2)}
.tag.volt{background:var(--green-w);color:var(--green)}
.tag.cy{background:var(--blue-w);color:var(--blue)}
.tag.gold{background:var(--amber-w);color:var(--amber)}
.tag.hot{background:var(--coral-w);color:var(--coral)}

.stat{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:13px 14px}
.stat b{display:block;font:700 26px/1.05 var(--f);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--tx3);font-weight:600}

.mission{display:flex;gap:14px;align-items:center;background:var(--bg);border:1px solid var(--line);
  border-radius:var(--r);padding:16px;cursor:pointer;text-align:left;width:100%;box-shadow:var(--sh);
  transition:border-color .15s,transform .1s}
.mission:hover{border-color:var(--blue);transform:translateY(-2px)}
.mission .ic{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:var(--bg3)}
.mission .ic.volt{background:var(--green-w)}.mission .ic.cy{background:var(--blue-w)}
.mission .ic.gold{background:var(--amber-w)}.mission .ic.hot{background:var(--coral-w)}
.mission .tx{flex:1;min-width:0}
.mission .tx b{display:block;font-size:16px;font-weight:700;margin-bottom:2px}
.mission .tx span{font-size:12.5px;color:var(--tx3);display:block;line-height:1.45}
.mission .arrow{flex:none;color:var(--tx3);font-size:18px}

.srow{display:flex;gap:13px;align-items:center;padding:14px 15px;background:var(--bg);border:1px solid var(--line);
  border-radius:var(--r2);cursor:pointer;width:100%;text-align:left}
.srow:hover{border-color:var(--blue);background:var(--bg2)}
.srow .ring{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  font:700 12.5px/1 var(--f);font-variant-numeric:tabular-nums}
.srow .m{flex:1;min-width:0}
.srow .m b{display:block;font-size:15px;font-weight:700}
.srow .m span{font-size:12.5px;color:var(--tx3)}
.srow .bar{height:6px;background:var(--bg3);border-radius:99px;margin-top:8px;overflow:hidden}
.srow .bar>i{display:block;height:100%;border-radius:99px;background:var(--blue)}

.chap{display:flex;gap:12px;align-items:center;padding:13px 14px;background:var(--bg);border:1px solid var(--line);
  border-radius:var(--r2);cursor:pointer;width:100%;text-align:left;margin-bottom:8px}
.chap:hover{border-color:var(--blue);background:var(--bg2)}
.chap .st{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  font:700 12.5px/1 var(--f);background:var(--bg3);color:var(--tx3)}
.chap .st.done{background:var(--green);color:#fff}
.chap .st.part{background:var(--amber-w);color:var(--amber)}
.chap .m{flex:1;min-width:0}
.chap .m b{display:block;font-size:15px;font-weight:600;line-height:1.35}
.chap .m span{font-size:12.5px;color:var(--tx3)}

/* ---------- reader ---------- */
.hero{background:linear-gradient(160deg,#f2f7ff,#fbfcfe);border:1px solid #dde7fb;border-radius:var(--r);
  padding:22px;margin-bottom:18px}
.hero h2{font-size:26px;margin-bottom:9px;letter-spacing:-.03em}
.hero .kick{font-size:16px;color:var(--tx2);line-height:1.62;max-width:var(--col)}
.sec{margin:30px 0 0}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-h i{width:27px;height:27px;border-radius:9px;background:var(--blue-w);color:var(--blue);
  display:grid;place-items:center;font:700 12.5px/1 var(--f);font-style:normal}
.sec-h h3{font-size:18px}
.prose{max-width:var(--col);font-size:16px;line-height:1.72;color:var(--tx2)}
.prose strong{color:var(--tx);font-weight:700}
.prose p{margin:0 0 .9em}
.kbd{font:600 15px/1.4 var(--fm);background:var(--bg3);color:var(--blue-d);padding:2px 7px;border-radius:6px}

.ess{list-style:none;margin:0;padding:0;max-width:var(--col);counter-reset:e}
.ess li{counter-increment:e;display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;
  padding:13px 15px;background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--teal);
  border-radius:var(--r2);margin-bottom:8px;font-size:16px;line-height:1.55}
.ess li::before{content:counter(e);font:700 12.5px/2 var(--f);color:var(--teal);background:var(--teal-w);
  border-radius:7px;text-align:center;height:24px}

.myth{max-width:var(--col);margin:16px 0 4px;padding:14px 16px;border-radius:var(--r2);
  background:var(--amber-w);border:1px solid #f0dcae;border-left:3px solid var(--amber);
  font-size:15px;line-height:1.62;color:var(--tx2)}
.myth b{display:block;font:700 11.5px/1.4 var(--f);color:var(--amber);letter-spacing:.06em;
  text-transform:uppercase;margin-bottom:6px}

.ib{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:14px 15px}
.ib h5{margin:0 0 6px;font:700 11.5px/1.4 var(--f);color:var(--tx3);letter-spacing:.05em;text-transform:uppercase}
.ib p{margin:0;font-size:14px;line-height:1.6;color:var(--tx2)}
.terms{max-width:var(--col);margin:0;padding:0}
.terms>div{display:grid;grid-template-columns:minmax(130px,auto) 1fr;gap:14px;padding:12px 15px;
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r2);margin-bottom:7px}
.terms dt{margin:0;font:700 15px/1.5 var(--f);color:var(--blue-d)}
.terms dd{margin:0;font-size:15px;line-height:1.55;color:var(--tx2)}
@media(max-width:560px){
  /* Auf dem Telefon nur die Kurzform des Abschlusses, damit nichts abschneidet */
  body>.top .progpill{font-size:11.5px;padding:6px 10px;max-width:none;overflow:visible}
  body>.top .progpill::after{content:""}
}
@media(max-width:520px){.terms>div{grid-template-columns:1fr;gap:3px}}

.warn{max-width:var(--col);background:var(--coral-w);border:1px solid #f5cfcc;border-left:3px solid var(--coral);
  border-radius:var(--r2);padding:14px 16px;font-size:15px;line-height:1.6;color:var(--tx2)}
.warn b{color:var(--coral)}
.tipbox{max-width:var(--col);background:var(--teal-w);border:1px solid #c4e9e3;border-radius:var(--r2);
  padding:14px 16px;font-size:15px;line-height:1.6;color:var(--tx2)}

/* ---------- illustrations ---------- */
.figure{max-width:var(--col);margin:16px 0;background:var(--bg);border:1px solid var(--line);
  border-radius:var(--r);padding:16px 16px 13px;box-shadow:var(--sh)}
.figure h6{margin:0 0 10px;font:700 12.5px/1.4 var(--f);color:var(--tx3);letter-spacing:.05em;text-transform:uppercase}
.figure figcaption{margin-top:10px;font-size:14px;line-height:1.55;color:var(--tx3)}
svg.ill{width:100%;height:auto;display:block}
svg.ill .ax{stroke:var(--line2);stroke-width:1.5}
svg.ill .axh{fill:var(--line2)}
svg.ill .curve{fill:none;stroke:var(--blue);stroke-width:2.6;stroke-linecap:round}
svg.ill .curve2{fill:none;stroke:var(--violet);stroke-width:2.6;stroke-linecap:round}
svg.ill .aux{fill:none;stroke:var(--tx3);stroke-width:1.4;stroke-dasharray:5 4}
svg.ill .aux2{fill:none;stroke:var(--line2);stroke-width:1.4;stroke-dasharray:3 3}
svg.ill .hi{fill:none;stroke:var(--coral);stroke-width:2.6;stroke-linecap:round}
svg.ill .hih{fill:var(--coral)}
svg.ill .sum{fill:none;stroke:var(--teal);stroke-width:2.6;stroke-linecap:round}
svg.ill .sumh{fill:var(--teal)}
svg.ill .dot{fill:var(--blue)}
svg.ill .dot.hi-d{fill:var(--coral)}
svg.ill .hole{fill:#fff;stroke:var(--blue);stroke-width:2.2}
svg.ill .bar{fill:var(--blue-w);stroke:var(--blue);stroke-width:1.2}
svg.ill .lb{font:600 11.5px var(--f);fill:var(--tx3)}
svg.ill .lb.hi-t{fill:var(--coral)}
svg.ill .sym{font:700 12.5px var(--f);fill:var(--tx)}
svg.ill .sym.sm{font-size:11.5px}
svg.ill .circ{fill:none;stroke:var(--line2);stroke-width:1.6}
svg.ill .arcline{fill:none;stroke:var(--coral);stroke-width:1.6}
svg.ill .box{fill:var(--bg3);stroke:var(--tx3);stroke-width:1.6}
svg.ill .box2{fill:var(--bg2);stroke:var(--line2);stroke-width:1.4}
svg.ill .box2.hi-b{fill:var(--blue-w);stroke:var(--blue)}
svg.ill .vessel{fill:none;stroke:var(--tx3);stroke-width:2}
svg.ill .water{fill:#d8ecff;stroke:none}
svg.ill .membrane{stroke:var(--coral);stroke-width:2.4;stroke-dasharray:6 4}
svg.ill .wire{fill:none;stroke:var(--tx2);stroke-width:2}
svg.ill .res{fill:var(--amber-w);stroke:var(--amber);stroke-width:1.6}
svg.ill .lens{fill:#dcecff;stroke:var(--blue);stroke-width:1.8}
svg.ill .ray{fill:none;stroke:var(--amber);stroke-width:1.8}
svg.ill .ray2{fill:none;stroke:var(--violet);stroke-width:1.8}
svg.ill .obj{stroke:var(--teal);stroke-width:2.6}
svg.ill .objh{fill:var(--teal)}
svg.ill .nucleus{fill:var(--coral)}
svg.ill .atomO{fill:#d8ecff;stroke:var(--blue);stroke-width:1.8}
svg.ill .atomH{fill:var(--bg3);stroke:var(--tx3);stroke-width:1.6}
svg.ill .bond{stroke:var(--tx2);stroke-width:2.4}
svg.ill .cellw{fill:#f0f9f4;stroke:var(--green);stroke-width:2}
svg.ill .organ{fill:#dfeaff;stroke:var(--blue);stroke-width:1.6}
svg.ill .organ2{fill:var(--coral-w);stroke:var(--coral);stroke-width:1.6}
svg.ill .organ3{fill:var(--violet-w);stroke:var(--violet);stroke-width:1.6}
svg.ill .strand{stroke:var(--blue);stroke-width:3;stroke-linecap:round}
svg.ill .rung{stroke:var(--line2);stroke-width:1.4}
svg.ill .tier1{fill:#e3f6ea;stroke:var(--green);stroke-width:1.4}
svg.ill .tier2{fill:#d3f0df;stroke:var(--green);stroke-width:1.4}
svg.ill .tier3{fill:#bfe8d0;stroke:var(--green);stroke-width:1.4}
svg.ill .tier4{fill:#a6dfbf;stroke:var(--green);stroke-width:1.4}
svg.ill .plate{fill:var(--bg3);stroke:var(--tx3);stroke-width:1.6}
svg.ill .plate2{fill:#e6dcc8;stroke:var(--amber);stroke-width:1.6}
svg.ill .mount{fill:#e8e4da;stroke:var(--tx3);stroke-width:1.6}
svg.ill .cloud{fill:#dce8f7;stroke:var(--line2);stroke-width:1.2}
svg.ill .rain{stroke:var(--blue);stroke-width:1.6}
svg.ill .shell1{fill:#e8edf6;stroke:var(--line2);stroke-width:1.4}
svg.ill .shell2{fill:#d9c9a8;stroke:var(--amber);stroke-width:1.4}
svg.ill .shell3{fill:#f4b26a;stroke:var(--amber);stroke-width:1.4}
svg.ill .shell4{fill:var(--coral);stroke:none}
svg.ill .stack{fill:var(--bg3);stroke:var(--line2);stroke-width:1.2}
svg.ill .spark{fill:var(--coral-w);stroke:var(--coral);stroke-width:2}
svg.ill .pha{fill:#f9c9c4}svg.ill .phn{fill:#d7dde8}svg.ill .phb{fill:#c6dcf7}

/* ---------- formula cards ---------- */
.fcard{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  margin-bottom:11px;max-width:var(--col);box-shadow:var(--sh)}
.fcard.open{border-color:var(--blue)}
.fhead{display:flex;gap:13px;align-items:center;width:100%;background:none;border:0;padding:15px 16px;
  cursor:pointer;text-align:left}
.fhead:hover{background:var(--bg2)}
.fx{flex:none;font:600 16px/1.45 var(--fm);color:var(--blue-d);background:var(--blue-w);
  border-radius:9px;padding:8px 11px;max-width:52%;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.fx::-webkit-scrollbar{display:none}
.fmeta{min-width:0;flex:1}
.fmeta b{display:block;font-size:15px;font-weight:700}
.fmeta span{font-size:12.5px;color:var(--tx3)}
.fbody{padding:0 16px 16px;border-top:1px solid var(--line)}
.fbody h4{font-size:11.5px;font-weight:700;color:var(--tx3);margin:18px 0 8px;letter-spacing:.06em}
.syms{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.syms li{display:grid;grid-template-columns:auto 1fr;gap:12px;font-size:14px;color:var(--tx2)}
.syms code{font:600 14px/1.45 var(--fm);color:var(--blue-d)}

/* parameter table */
.params{display:grid;gap:9px}
.par{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px}
.par-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.par-sym{font:700 16px/1.3 var(--fm);color:var(--blue-d);background:var(--bg);border:1px solid var(--line);
  border-radius:7px;padding:3px 9px}
.par-name{font-weight:700;font-size:14px}
.par-unit{margin-left:auto;font:600 12.5px/1.4 var(--fm);color:var(--teal);background:var(--teal-w);
  padding:3px 9px;border-radius:99px}
.par-means{font-size:14px;line-height:1.58;color:var(--tx2);margin-bottom:6px}
.par-eff{font-size:14px;line-height:1.55;color:var(--tx2);padding-left:12px;border-left:2px solid var(--amber)}
.par-eff::before{content:"Wenn sich das ändert: ";font-weight:700;color:var(--amber)}
.unitcheck{background:var(--teal-w);border:1px solid #c4e9e3;border-radius:var(--r2);padding:12px 14px;
  font-size:14px;line-height:1.58;color:var(--tx2)}
.unitcheck b{color:var(--teal)}
.rearr{font:600 14px/1.7 var(--fm);background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);
  padding:11px 13px;color:var(--tx);overflow-x:auto}

.rung{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.rung:first-of-type{border-top:0}
.rung.hide{display:none}
.rn{font:700 11.5px/2 var(--f);color:var(--blue);background:var(--blue-w);border-radius:7px;text-align:center;height:24px}
.rw{font-size:12.5px;font-weight:700;color:var(--tx3);margin-bottom:6px}
.rmath{font:600 15px/1.55 var(--fm);color:var(--tx);background:var(--bg2);border:1px solid var(--line);
  border-left:3px solid var(--blue);border-radius:8px;padding:9px 12px;overflow-x:auto}
.rwhy{font-size:14px;line-height:1.6;color:var(--tx2);margin-top:7px}
.rwhy::before{content:"Warum: ";font-weight:700;color:var(--blue)}
.worked{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:14px 15px;margin-top:9px}
.worked .tk{font-weight:700;font-size:15px;margin-bottom:8px}
.worked ol{margin:0 0 9px;padding-left:1.3em;font-size:15px;line-height:1.65;color:var(--tx2)}
.worked .res{display:inline-block;font:700 15px/1.45 var(--fm);background:var(--green-w);color:var(--green);
  border-radius:8px;padding:7px 12px}
.exlv{display:inline-block;font:700 11.5px/1.6 var(--f);padding:3px 10px;border-radius:99px;margin-bottom:8px}
.exlv.l1{background:var(--green-w);color:var(--green)}
.exlv.l2{background:var(--blue-w);color:var(--blue)}
.exlv.l3{background:var(--amber-w);color:var(--amber)}

/* ---------- quiz ---------- */
.arena{max-width:660px;margin:0 auto}
.abar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.hearts{display:flex;gap:3px}
.heart{font-size:18px;filter:grayscale(1) opacity(.28)}
.heart.on{filter:none}
.prog{flex:1;min-width:110px;height:9px;background:var(--bg3);border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .35s}
.combo{font:700 12.5px/1 var(--f);color:var(--amber);background:var(--amber-w);border-radius:99px;padding:7px 12px}
.combo.big{animation:pop .4s}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.2)}100%{transform:scale(1)}}
.clock{font:700 14px/1 var(--fm);background:var(--bg3);padding:8px 11px;border-radius:99px;font-variant-numeric:tabular-nums}
.clock.low{background:var(--coral-w);color:var(--coral)}

.qcard{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:19px;box-shadow:var(--sh)}
.qmeta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.qp{font-size:18px;font-weight:700;line-height:1.5;margin:5px 0 16px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--bg);
  border:1.5px solid var(--line2);border-radius:var(--r2);padding:14px 15px;cursor:pointer;font-size:16px;
  line-height:1.5;transition:border-color .12s,background .12s,transform .08s}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-w);transform:translateX(2px)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:25px;height:25px;border-radius:8px;background:var(--bg3);border:1px solid var(--line2);
  font:700 12.5px/24px var(--f);text-align:center;color:var(--tx3)}
.opt.right{border-color:var(--green);background:var(--green-w)}
.opt.right .k{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--coral);background:var(--coral-w)}
.opt.wrong .k{background:var(--coral);border-color:var(--coral);color:#fff}
.fb{border-radius:var(--r2);padding:15px 16px;margin-top:14px;font-size:15px;line-height:1.65;color:var(--tx2)}
.fb.ok{background:var(--green-w);border:1px solid #c3e9d3;border-left:3px solid var(--green)}
.fb.no{background:var(--coral-w);border:1px solid #f5cfcc;border-left:3px solid var(--coral)}
.fb .v{display:block;font-weight:700;margin-bottom:5px;font-size:16px;color:var(--tx)}
.fb .ref{display:block;margin-top:9px;font-size:14px;color:var(--tx3)}
input.ans,textarea.ans{width:100%;background:var(--bg);border:1.5px solid var(--line2);border-radius:var(--r2);
  padding:14px 15px;font:600 16px/1.4 var(--fm);color:var(--tx)}
textarea.ans{font:400 16px/1.6 var(--f);resize:vertical}
.sortl{display:flex;flex-direction:column;gap:8px}
.sr{display:flex;gap:10px;align-items:center;background:var(--bg);border:1.5px solid var(--line2);
  border-radius:var(--r2);padding:11px 12px;font-size:15px}
.sr .i{flex:none;font:700 11.5px/1 var(--f);color:var(--blue);background:var(--blue-w);padding:7px 9px;border-radius:7px}
.sr .t{flex:1;min-width:0;line-height:1.45}
.sr .mv{display:flex;gap:4px;flex:none}
.sr .mv button{width:30px;height:30px;border:1px solid var(--line2);background:var(--bg);border-radius:8px;
  cursor:pointer;color:var(--tx2);padding:0;font-size:12.5px}
.sr .mv button:disabled{opacity:.28;cursor:not-allowed}
.sr.right{border-color:var(--green);background:var(--green-w)}
.sr.bad{border-color:var(--coral);background:var(--coral-w)}

.result{text-align:center;padding:24px 16px}
.result .big{font:700 32px/1 var(--f);letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin-bottom:6px}
.result .grade{display:inline-block;font:700 16px/1 var(--f);padding:11px 18px;border-radius:99px;margin:11px 0}
.badges{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:16px 0}
.badge{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:11px 13px;min-width:96px}
.badge.earned{border-color:var(--amber);background:var(--amber-w)}
.badge .e{font-size:21px;display:block;margin-bottom:4px}
.badge .n{font:700 11.5px/1.35 var(--f);color:var(--tx2)}
.badge.locked{opacity:.4}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 11px;border-bottom:1px solid var(--line)}
th{font:700 12.5px/1.35 var(--f);color:var(--tx3)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.empty{padding:30px 16px;text-align:center;color:var(--tx3);font-size:15px}
.foot{border-top:1px solid var(--line);margin-top:38px;padding-top:18px;font-size:12.5px;color:var(--tx3);max-width:var(--col)}
@media(max-width:560px){
  body{font-size:16px}
  .hero h2{font-size:21px}.result .big{font-size:32px}.top-in{flex-wrap:wrap}
  .hud{width:100%;justify-content:flex-start;margin-left:0}
  .fx{max-width:100%}
  .fhead{flex-wrap:wrap}
}

/* ---------- Spass-Ebene ---------- */
.bossbar{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#fff6ed,#fff);
  border:1px solid #f2d9bd;border-radius:var(--r);padding:12px 15px;margin-bottom:14px;box-shadow:var(--sh)}
.bossbar .bemo{font-size:26px;flex:none}
.bossbar .bmeta{flex:1;min-width:0}
.bossbar .bmeta b{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
.bhp{display:block;height:9px;background:var(--bg3);border-radius:99px;overflow:hidden}
.bhp>i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),#f08a4b);
  border-radius:99px;transition:width .45s}
.bossbar .bnum{flex:none;font:700 12.5px/1 var(--f);color:var(--coral)}
.bossres{display:flex;flex-direction:column;gap:4px;align-items:center;padding:14px;border-radius:var(--r2);
  margin-bottom:12px}
.bossres.won{background:var(--green-w);border:1px solid #c3e9d3}
.bossres.lost{background:var(--coral-w);border:1px solid #f5cfcc}
.bossres .bemo{font-size:26px}
.bossres b{font-size:16px}
.bossres span:last-child{font-size:14px;color:var(--tx2);max-width:44ch}
.verdict{max-width:46ch;margin:0 auto 6px;font-size:15px;line-height:1.6;color:var(--tx2)}
.verdict b{color:var(--tx);display:block;font-size:16px;margin-bottom:3px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;max-width:min(440px,92vw);
  background:var(--tx);color:#fff;border-radius:14px;padding:14px 18px;font-size:14px;line-height:1.55;
  box-shadow:0 12px 32px -12px rgba(27,33,48,.55);animation:tin .35s ease-out}
.toast b{display:block;font-size:15px;margin-bottom:3px}
.toast.up{background:linear-gradient(135deg,var(--blue),var(--teal))}
.toast.boss{background:linear-gradient(135deg,#b3412f,#d9713c)}
.toast.gone{opacity:0;transform:translateX(-50%) translateY(10px);transition:opacity .5s,transform .5s}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(14px)}to{opacity:1}}
.xpfly{color:var(--green);font-weight:700}

/* ---------- Fehler-Autopsie ---------- */
.autopsy{max-width:var(--col);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  padding:17px;margin-bottom:13px;box-shadow:var(--sh)}
.au-task{font-size:15px;line-height:1.6;margin-bottom:13px;color:var(--tx2)}
.au-task b,.au-wrong b,.au-diag b{display:block;font:700 11.5px/1.4 var(--f);letter-spacing:.06em;
  text-transform:uppercase;color:var(--tx3);margin-bottom:6px}
.au-wrong{background:var(--coral-w);border:1px solid #f5cfcc;border-radius:var(--r2);padding:13px 15px}
.au-wrong b{color:var(--coral)}
.au-wrong ol{margin:0 0 9px;padding-left:1.35em;font:600 14px/1.75 var(--fm);color:var(--tx2)}
.au-res{display:inline-block;font:700 14px/1.4 var(--fm);border-radius:8px;padding:7px 12px}
.au-res.bad{background:#fff;color:var(--coral);border:1px solid #f0c3c0}
.au-res.good{background:var(--green-w);color:var(--green)}

.au-diag{margin-top:13px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:14px 15px}
.au-where{font-weight:700;font-size:15px;color:var(--amber);margin-bottom:7px}
.au-diag p{font-size:15px;line-height:1.65;color:var(--tx2);margin:0 0 13px}
.au-diag b{color:var(--green);margin-top:4px}
.au-diag ol{margin:0 0 9px;padding-left:1.35em;font:600 14px/1.75 var(--fm);color:var(--tx2)}
.au-lesson{margin-top:13px;padding:11px 13px;background:var(--blue-w);border-left:3px solid var(--blue);
  border-radius:8px;font-size:14px;line-height:1.6;color:var(--tx2)}
.au-lesson::before{content:"Merke: ";font-weight:700;color:var(--blue)}

/* ---------- Details ---------- */
.keyhint{margin-top:11px;text-align:center;font-size:12.5px;color:var(--tx3)}
.keyhint b{display:inline-block;background:var(--bg3);border:1px solid var(--line2);border-radius:5px;
  padding:1px 6px;font:700 11.5px/1.5 var(--fm);color:var(--tx2)}
@media(max-width:560px){.keyhint{display:none}}
.chap-prog{display:flex;flex-direction:column;gap:6px;margin-top:15px;max-width:var(--col);
  font-size:12.5px;color:var(--tx3)}
.cp{display:block;height:7px;background:#e0e8f6;border-radius:99px;overflow:hidden}
.cp>i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .5s}

/* ---------- Druckausgabe ---------- */
@media print{
  .top,.nav,.keyhint,
  body{background:#fff;color:#000;font-size:11pt}
  main{max-width:none;padding:0}
  .card,.figure,.fcard,.autopsy,.qcard{box-shadow:none;break-inside:avoid;page-break-inside:avoid}
  .fbody,.au-diag{display:block!important}
  .fbody[hidden],.au-diag[hidden]{display:block!important}
  .rung.hide{display:grid!important}
  .hero{background:none;border:0;border-bottom:2pt solid #000;border-radius:0;padding:0 0 8pt}
  .sec-h i{border:1pt solid #666;background:none;color:#000}
  a{color:#000;text-decoration:none}
  a[href^="http"]::after{content:" (" attr(href) ")";font-size:8pt;color:#555}
  .prose,.ess li,.terms dd{color:#000}
  h2,h3{break-after:avoid;page-break-after:avoid}
}

.confid{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:13px;padding:12px 14px;
  background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2)}
.confid>span{font-size:14px;font-weight:600;color:var(--tx2);margin-right:auto}

.confid kbd{display:inline-block;margin-left:5px;background:var(--bg3);border:1px solid var(--line2);
  border-radius:5px;padding:0 5px;font:700 11.5px/1.7 var(--fm);color:var(--tx3)}

/* ---------- Fachfarben ---------- */
.s-math{--sc:#2f6df0;--scw:#eaf0ff}
.s-biology{--sc:#18a05c;--scw:#e6f7ee}
.s-chemistry{--sc:#7a4fd6;--scw:#f1ecfd}
.s-physics{--sc:#0d9b8a;--scw:#e2f6f3}
.s-history{--sc:#b5790a;--scw:#fdf3dd}
.s-geography{--sc:#0f7fb8;--scw:#e4f2fa}
.s-german{--sc:#c24a6b;--scw:#fceaf0}
.s-english{--sc:#3f6ab8;--scw:#ebf0fa}
.hero.sub{background:linear-gradient(155deg,var(--scw),#fff);border-color:color-mix(in srgb,var(--sc) 22%,#fff)}
.hero.sub .sub-badge{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);
  border-radius:99px;padding:5px 12px;font:700 12.5px/1 var(--f);color:var(--sc);margin-bottom:11px}
.hero.sub .sub-badge i{width:9px;height:9px;border-radius:50%;background:var(--sc);font-style:normal}
.sec-h i{background:var(--scw,var(--blue-w));color:var(--sc,var(--blue))}
.ess li{border-left-color:var(--sc,var(--teal))}
.ess li::before{color:var(--sc,var(--teal));background:var(--scw,var(--teal-w))}
.cp>i{background:var(--sc,var(--teal))}
.srow .ring.s{background:var(--scw);color:var(--sc)}

/* ---------- freundlicher Einstieg ---------- */
.greet{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.greet-tx{flex:1;min-width:220px}
.greet-tx h1{font-size:26px;letter-spacing:-.03em;margin-bottom:5px}
.greet-tx p{margin:0;font-size:15px;color:var(--tx3)}
.count{display:flex;gap:10px;flex-wrap:wrap}
.count>div{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:11px 14px;min-width:92px;text-align:center}
.count b{display:block;font:700 21px/1.05 var(--f);letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--blue)}
.count span{font-size:11.5px;color:var(--tx3);font-weight:600}
.count>div.warm b{color:var(--amber)}

/* ---------- Lehrer-Kapitel ---------- */













.help{max-width:var(--col);background:var(--blue-w);border:1px solid #cbdcff;border-radius:var(--r2);padding:14px 15px;margin-top:11px}
.help>b{display:block;margin-bottom:9px;font-size:15px}
.helpout{margin-top:12px}
.helpask{margin-top:11px;font-size:14px;color:var(--tx2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pre{max-width:var(--col);background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:14px 15px;margin-bottom:10px}
.pre.needed{border-color:var(--amber);background:var(--amber-w)}
.pre>b{display:block;font-size:15px;margin-bottom:7px}




















.ask{background:var(--amber-w);border:1px solid #f0dcae;border-radius:var(--r2);padding:13px 15px}
.ask b{display:block;font-size:15px;margin-bottom:4px}
.ask span{display:block;font-size:14px;color:var(--tx2);margin-bottom:10px}
.exfoot{margin-top:11px;display:flex;flex-direction:column;gap:10px}




/* ---------- Hörsteuerung ---------- */
.listen{position:sticky;top:56px;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:18px;box-shadow:var(--sh)}
.listen.off{opacity:.7}
.lrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.lrow+.lrow{margin-top:9px}
.lrow label{display:flex;gap:6px;align-items:center;color:var(--tx3);font-weight:600}
.lrow select{padding:5px 8px;font-size:12.5px}
.lchk{cursor:pointer}
.lstate{margin-left:auto;font:700 12.5px/1 var(--f);color:var(--blue);background:var(--blue-w);
  padding:6px 11px;border-radius:99px}
.lnote{margin-top:9px;font-size:14px;line-height:1.55;color:var(--amber);background:var(--amber-w);
  border-radius:9px;padding:10px 12px}
.speaking{background:#fff6cc!important;border-radius:6px;box-shadow:0 0 0 4px #fff6cc}
@media(max-width:560px){.listen{position:static}.lstate{margin-left:0}}

/* ---------- Fach-Signets ---------- */
svg.logo-mark{width:1em;height:1em;display:inline-block;vertical-align:-.12em;overflow:visible}
svg.logo-mark .lk{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
svg.logo-mark .lf{fill:currentColor;stroke:none}
.sub-badge svg.logo-mark{font-size:16px;color:var(--sc)}
.srow .ring{position:relative;flex-direction:column;gap:0}
.srow .ring svg.logo-mark{font-size:16px;color:var(--sc);margin-bottom:-2px}
.srow .ring em{font-style:normal;font:700 11px/1 var(--f)}
.tab .logo-mark,.chap .logo-mark{font-size:15px}

/* ---------- animierter Hintergrund ---------- */



body>.top,body>.nav,body>main{position:relative;z-index:1}

/* ---------- Kompaktansicht ---------- */
.digestbar{display:flex;gap:7px;align-items:center;margin-bottom:14px;font-size:12.5px;color:var(--tx3)}
.digestbar>span{font-weight:700;margin-right:4px}

/* ---------- Wischkarten ---------- */
.swipe{max-width:560px;margin:0 auto}
.swipe-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.swipe-count{margin-left:auto;font:700 12.5px/1 var(--display);color:var(--tx3)}
.deck{position:relative;min-height:300px;perspective:1200px;display:grid}
.card-ghost{position:absolute;inset:0;border-radius:24px;background:#fff;box-shadow:var(--sh);border:1px solid var(--line)}
.card-ghost.g0{transform:scale(.94) translateY(16px);opacity:.55}
.card-ghost.g1{transform:scale(.89) translateY(30px);opacity:.3}
.card-swipe{position:relative;z-index:1;min-height:300px;border-radius:24px;background:#fff;box-shadow:var(--shx);
  border:1px solid var(--line);padding:30px;display:flex;flex-direction:column;justify-content:center;
  cursor:grab;user-select:none;transition:transform .28s cubic-bezier(.2,.8,.3,1),opacity .28s;touch-action:pan-y}
.card-swipe.dragging{transition:none;cursor:grabbing}
.card-swipe.fly-right{transform:translateX(130%) rotate(22deg)!important;opacity:0}
.card-swipe.fly-left{transform:translateX(-130%) rotate(-22deg)!important;opacity:0}
.cs-kicker{display:block;font:700 11.5px/1.4 var(--display);letter-spacing:.09em;text-transform:uppercase;
  color:var(--tx3);margin-bottom:14px}
.cs-face p{font-size:21px;line-height:1.4;font-weight:600;margin:0 0 16px;color:var(--ink)}
.cs-back p{color:var(--green)}
.cs-why{display:block;font-size:14px;line-height:1.6;color:var(--tx2);border-top:1px solid var(--line);padding-top:14px}
.cs-flip{margin-top:0}
.cs-back{border-top:1px solid var(--line);margin-top:6px;padding-top:16px}
.cs-toggle-row{display:flex;justify-content:center;margin-top:16px}
.swipe-budget{margin:-8px 0 12px}
.cs-status{text-align:center;min-height:1.4em;margin:10px 0 0}
.cs-stamp{position:absolute;top:26px;font:700 16px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;
  padding:9px 15px;border-radius:10px;opacity:0;pointer-events:none;border:3px solid}
.cs-yes{right:26px;color:var(--green);border-color:var(--green);transform:rotate(12deg)}
.cs-no{left:26px;color:var(--coral);border-color:var(--coral);transform:rotate(-12deg)}
.swipe-act{display:flex;gap:10px;justify-content:center;margin-top:26px}
.swipe-act .btn{min-width:128px;border-radius:99px;padding:13px 18px;font-weight:700}
.swipe-no:hover{border-color:var(--coral);color:var(--coral);background:var(--coral-w)}
.swipe-yes{box-shadow:0 4px 14px -4px rgba(24,160,92,.6);background:var(--green);border-color:var(--green)}
.swipe-yes:hover{background:#14824b;border-color:#14824b}
.swipe-skip{opacity:.75}
@media(max-width:560px){.deck,.card-swipe{min-height:240px}.card-swipe{padding:22px}.cs-face p{font-size:18px}
  .swipe-act{flex-wrap:wrap}.swipe-act .btn{min-width:0;flex:1}}

/* Aufräumen */
.grid{gap:14px}
.stack{gap:14px}
.row{gap:9px}
.tag{padding:4px 11px;font-size:11.5px}
.btn{border-radius:11px}
.foot{margin-top:56px;padding-top:22px}




/* ============================================================
   Mobile: alles ab 320 Pixel sauber, nichts abgeschnitten
   ============================================================ */
img,svg,table,pre{max-width:100%}
.scroll{-webkit-overflow-scrolling:touch}
.figure{overflow:hidden}
svg.ill{max-width:100%;height:auto}

@media(max-width:760px){
  main{padding:20px 14px 96px}
  .hero{padding:24px 20px;border-radius:18px}
  .hero h2{font-size:clamp(21px,6.2vw,26px)}
  .hero .kick{font-size:16px}
  
  .grid.g4,.grid.g3{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .sec,
  .sec-h h3,
  .prose{font-size:16px;line-height:1.72}
  .qcard{padding:18px}
  .qp{font-size:18px}
  .opt{padding:14px;font-size:16px}
  .fhead{gap:10px}
  .fx{max-width:100%;font-size:14px}
  
  
  .listen{padding:11px 12px}
  .lrow{gap:6px}
  .lrow .btn{padding:8px 10px;font-size:12.5px;flex:1 1 auto}
  .lrow label{font-size:12.5px}
  .digestbar{flex-wrap:wrap}
  .par-h{gap:7px}
  .par-unit{margin-left:0}
  .stat b{font-size:21px}
  .covgrid{grid-template-columns:1fr 1fr}
  .top-in{padding:10px 14px}
  .nav-in{padding:6px 10px}
  .tab{padding:8px 13px;font-size:14px}
}
@media(max-width:400px){
  body{font-size:15px}
  main{padding:16px 11px 88px}
  .hero{padding:20px 16px}
  .grid.g4,.grid.g3,.grid.g2{grid-template-columns:1fr}
  .covgrid{grid-template-columns:1fr}
  
  .swipe-act{flex-direction:column}
  .swipe-act .btn{width:100%}
  .terms>div{grid-template-columns:1fr}
  
  
  table{font-size:12.5px}
  th,td{padding:8px 7px}
}
/* Tabellen auf kleinen Schirmen scrollbar statt gequetscht */
@media(max-width:640px){
  .card .scroll{margin:0 -15px;padding:0 15px}
  table{min-width:460px}
}

/* ============================================================
   Konsolidiertes System. Ein Farbsatz, ein Rahmensatz,
   eine Schattenstufe, 8-Pixel-Raster.
   ============================================================ */

body{background:var(--bg);color:var(--tx);font-size:16px}
h1,h2,h3{font-family:var(--fd);letter-spacing:-.018em;color:var(--ink)}h4,h5{font-family:var(--f);letter-spacing:-.01em;color:var(--ink)}
.s-math{--sc:#2b5ce6;--scw:#eaeeff}
.s-physics{--sc:#0e9e91;--scw:#e2f5f2}
.s-chemistry{--sc:#6f45d1;--scw:#f0eafd}
.s-biology{--sc:#1d9a5f;--scw:#e5f6ec}
.s-history{--sc:#a86a08;--scw:#fdf1da}
.s-geography{--sc:#0a7ea8;--scw:#e3f2f8}
.s-german{--sc:#bb3b63;--scw:#fce9ef}
.s-english{--sc:#3a5bab;--scw:#ecf0fa}

/* Hintergrundsymbole nur ausserhalb der Lernansichten */



/* ---------- Lektionsraster ---------- */
.lesson{display:grid;grid-template-columns:minmax(0,var(--main)) var(--rail);gap:32px;
  max-width:1200px;margin:0 auto;align-items:start}
.lesson-main{min-width:0}
.lnk{background:none;border:0;padding:0;color:var(--sc,var(--blue));font:600 14px/1.5 var(--f);
  cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lnk:hover{color:var(--ink)}
.lnk.warnlnk{color:var(--amber)}
.lnk.back{margin-bottom:var(--s2)}
.lesson-head{margin-bottom:var(--s4)}
.eyebrow{display:flex;align-items:center;gap:8px;font:700 12.5px/1 var(--f);color:var(--sc);
  text-transform:uppercase;letter-spacing:.07em;margin:0 0 var(--s2)}
.eyebrow svg.logo-mark{font-size:16px}
.lesson-head h1{font-size:clamp(26px,3.6vw,32px);line-height:1.08;margin:0 0 12px}
.lead{font-size:16px;line-height:1.6;color:var(--tx2);max-width:var(--col);margin:18px 0 0}

/* ---------- Phasen ---------- */
.phase{display:flex;gap:16px;align-items:baseline;margin:var(--s5) 0 var(--s3);
  padding-bottom:12px;border-bottom:2px solid var(--sc)}
.phase:first-of-type{margin-top:var(--s4)}
.phase-n{flex:none;font:700 12.5px/1 var(--f);color:#fff;background:var(--sc);
  border-radius:8px;padding:7px 9px}
.phase h2{font-size:21px;margin:0 0 4px}
.phase p{margin:0;font-size:14px;color:var(--tx3);max-width:var(--col)}

/* ---------- Lerneinheit ---------- */
.unit{margin:0 0 var(--s4);padding-bottom:var(--s3);border-bottom:1px solid var(--line)}
.unit:last-of-type{border-bottom:0}
.unit-title{font-size:21px;margin:0 0 6px}
.unit-take{margin:0 0 var(--s2);font-size:16px;line-height:1.55;color:var(--sc);
  font-weight:600;max-width:var(--col)}
.unit-body p{margin:0 0 1em;font-size:16px;line-height:1.75;color:var(--tx2);max-width:var(--col)}
.unit-body strong{color:var(--ink);font-weight:700}
.unit-visual{margin:var(--s3) 0}
.unit-check{margin-top:var(--s2)}
.unit-check .qcard{border:0;border-left:3px solid var(--sc);border-radius:0 var(--r2) var(--r2) 0;
  background:var(--bg2);box-shadow:none;padding:18px 20px}
.unit-more{margin-top:var(--s2)}
.more{background:var(--bg2);border-radius:var(--r2);padding:16px 18px;max-width:var(--col)}
.more-lbl{display:block;font:700 11.5px/1 var(--f);text-transform:uppercase;letter-spacing:.07em;
  color:var(--tx3);margin-bottom:8px}
.more p{margin:0 0 .8em;font-size:16px;line-height:1.7;color:var(--tx2)}
.more p:last-child{margin-bottom:0}
.unit-acts{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s2)}
@media(max-width:560px){.unit-acts{flex-wrap:nowrap;overflow-x:auto;gap:8px;margin:12px 0 0;padding:2px 0 8px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-mask:linear-gradient(90deg,#000 88%,transparent)}.unit-acts::-webkit-scrollbar{display:none}.unit-acts .lnk{flex:0 0 auto;white-space:nowrap;text-decoration:none;border:1px solid #d6dff0;border-radius:999px;padding:8px 13px;min-height:38px;background:#f5f7fc;font-weight:600;scroll-snap-align:start}}

/* ---------- Orientieren ---------- */
.why{max-width:var(--col);font-size:16px;line-height:1.7;color:var(--tx2);margin:0 0 6px}
.why-meta{font-size:14px;color:var(--tx3);margin:0 0 var(--s3)}
.diag{background:var(--bg2);border-radius:var(--r2);padding:20px;max-width:var(--col)}
.diag-lbl{display:block;font:700 11.5px/1 var(--f);text-transform:uppercase;letter-spacing:.07em;
  color:var(--tx3);margin-bottom:10px}
.diag p{margin:0 0 14px;font-size:16px;font-weight:600}
.diag-done{max-width:var(--col);font-size:16px;color:var(--green);font-weight:600}
.pre-lead{max-width:var(--col);font-size:16px;color:var(--amber);font-weight:600;margin-bottom:12px}
.fold{max-width:var(--col);border:1px solid var(--line);border-radius:var(--r2);
  padding:14px 18px;margin-bottom:10px;background:#fff}
.fold>summary{cursor:pointer;font-weight:700;font-size:16px;list-style:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"›";display:inline-block;margin-right:10px;color:var(--sc);
  font-weight:700;transition:transform .18s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold p{margin:12px 0 0;font-size:16px;line-height:1.7;color:var(--tx2)}
.fold .hint{color:var(--tx3);font-size:14px}
.fold.pre{border-left:3px solid var(--amber)}
.tagmini{font:700 11px/1 var(--f);background:var(--amber-w);color:var(--amber);
  padding:4px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em}
.pre-inline{margin-top:14px}
.pre-inline b{display:block;font-size:15px;margin-bottom:4px}

/* ---------- Modelle ---------- */
.model{max-width:var(--col);margin-bottom:var(--s4)}
.model-lbl{display:block;font:700 11.5px/1 var(--f);text-transform:uppercase;letter-spacing:.07em;
  color:var(--tx3);margin-bottom:6px}
.model-q,.model-words{margin:0 0 var(--s2);font-size:16px;line-height:1.65;color:var(--tx2)}
.model-expr{background:var(--ink);border-radius:var(--r2);padding:20px;margin-bottom:var(--s3)}
.model-expr .expr{display:block;font:600 21px/1.4 var(--fm);color:#fff}
.model-expr .expr-say{display:block;margin-top:10px;font-size:14px;color:#9fb0cc;font-style:italic}
.model h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);
  margin:0 0 12px}
.vars{margin:0 0 var(--s3)}
.vars dt{font-size:16px;font-weight:700;margin-top:16px}
.vars dt:first-child{margin-top:0}
.vars dt code{font:700 16px/1 var(--fm);color:var(--sc);margin-right:6px}
.vars dt .var-unit{font:600 12.5px/1 var(--fm);color:var(--teal);background:var(--teal-w);
  padding:3px 8px;border-radius:99px;margin-left:6px}
.vars dd{margin:5px 0 0;font-size:15px;line-height:1.65;color:var(--tx2)}
.var-eff{display:block;margin-top:5px;padding-left:12px;border-left:2px solid var(--amber);
  font-size:14px;color:var(--tx2)}
.chain{list-style:none;margin:0 0 var(--s3);padding:0;counter-reset:ch}
.chain li{counter-increment:ch;display:grid;grid-template-columns:28px minmax(0,1fr);gap:16px;
  padding:16px 0;border-top:1px solid var(--line);align-items:start}
.chain li::before{grid-row:1/span 2}
.chain-lbl{grid-column:2}
.chain-tx{grid-column:2;min-width:0;overflow-wrap:anywhere}
.chain li:first-child{border-top:0}
.chain li::before{content:counter(ch);font:700 12.5px/24px var(--f);color:#fff;background:var(--sc);
  border-radius:7px;text-align:center;height:24px}
.chain-lbl{display:block;font:700 11.5px/1 var(--f);text-transform:uppercase;letter-spacing:.06em;
  color:var(--tx3);margin-bottom:6px}
.chain-tx{font-size:16px;line-height:1.65;color:var(--tx2)}
.mono{font:600 14px/1.8 var(--fm);color:var(--tx)}

/* ---------- Beispiele ---------- */
.ex{border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:var(--s2);background:#fff}
.ex-mode{display:inline-block;font:700 11.5px/1 var(--f);text-transform:uppercase;letter-spacing:.06em;
  padding:5px 10px;border-radius:99px;margin-bottom:10px}
.ex-show{background:var(--green-w);color:var(--green)}
.ex-together{background:var(--blue-w);color:var(--blue)}
.ex-you{background:var(--amber-w);color:var(--amber)}
.ex-task{margin:0 0 var(--s2);font-size:16px;font-weight:600;line-height:1.5}
.ex-meta{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  margin:0 0 var(--s2);padding:14px;background:var(--bg2);border-radius:var(--r2)}
.ex-meta dt{font:700 11px/1 var(--f);text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);margin-bottom:4px}
.ex-meta dd{margin:0;font-size:14px;line-height:1.55;color:var(--tx2)}
.steps{margin:0 0 var(--s2);padding-left:1.3em}
.steps li{margin-bottom:14px}
.steps .do{display:block;font:600 15px/1.6 var(--fm);color:var(--ink)}
.steps .why{display:block;margin-top:5px;padding-left:12px;border-left:2px solid var(--sc);
  font-size:14px;line-height:1.6;color:var(--tx2)}
.steps .why::before{content:"Warum: ";font-weight:700;color:var(--sc)}
.ask{background:var(--amber-w);border-radius:var(--r2);padding:16px;font-size:15px;line-height:1.6}
.ask b{display:block;margin-bottom:4px}
.ask .btn{margin-top:12px}
.ex-res{display:inline-block;font:700 16px/1 var(--fm);background:var(--green-w);color:var(--green);
  padding:10px 14px;border-radius:var(--r2);margin:0 0 12px}
.ex-foot p{font-size:15px;line-height:1.65;color:var(--tx2);margin:0 0 10px;max-width:var(--col)}
.ex-wrong{color:var(--tx2)}
.ex-wrong strong{color:var(--coral)}

/* ---------- Klinik, Essenz, Teach-back, Mission ---------- */
.clinic p{font-size:16px;line-height:1.7;color:var(--tx2);max-width:var(--col);margin:0 0 12px}
.wrongsteps{margin:0 0 12px;padding-left:1.3em;font:600 15px/1.85 var(--fm);color:var(--tx2)}
.clinic .res{display:inline-block;font:700 15px/1 var(--fm);padding:9px 13px;border-radius:var(--r2)}
.clinic .res.bad{background:var(--coral-w);color:var(--coral)}
.clinic .res.good{background:var(--green-w);color:var(--green)}
.clinic .where{color:var(--amber);font-weight:700}
.clinic .lesson{background:var(--blue-w);border-radius:var(--r2);padding:14px 16px}
.essence{list-style:none;margin:0 0 var(--s3);padding:0;counter-reset:es;max-width:var(--col)}
.essence li{counter-increment:es;display:grid;grid-template-columns:26px 1fr;gap:14px;
  padding:14px 0;border-top:1px solid var(--line);font-size:16px;line-height:1.6;color:var(--tx2)}
.essence li:first-child{border-top:0}
.essence li::before{content:counter(es);font:700 12.5px/24px var(--f);color:var(--sc);
  background:var(--scw);border-radius:7px;text-align:center;height:24px}
.teachback{max-width:var(--col);margin-bottom:var(--s3)}
.teachback p{font-size:16px;line-height:1.65;color:var(--tx2);margin:0 0 12px}
.teachback textarea{width:100%;border:1px solid var(--line2);border-radius:var(--r2);padding:14px;
  font:400 16px/1.6 var(--f);color:var(--tx);background:#fff}
.teachback .btn{margin-top:12px}
.mission-row{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;max-width:var(--col);
  background:var(--scw);border-radius:var(--r);padding:20px}
.mission-row b{display:block;font-size:16px;margin-bottom:4px}
.mission-row span{font-size:15px;line-height:1.6;color:var(--tx2)}
.mission-row .btn{margin-left:auto}

/* ---------- Seitenschiene ---------- */
.rail{position:sticky;top:96px}
.rail-in{display:flex;flex-direction:column;gap:var(--s2)}
.rail-card{border:1px solid var(--line);border-radius:var(--r2);padding:16px;background:#fff}
.rail-lbl{display:block;font:700 11px/1 var(--f);text-transform:uppercase;letter-spacing:.08em;
  color:var(--tx3);margin-bottom:10px}
.rail-key{margin:0;font-size:15px;line-height:1.55;color:var(--ink);font-weight:600}
.rail-nav a{display:block;padding:6px 0;font-size:14px;color:var(--tx2);text-decoration:none}
.rail-nav a:hover{color:var(--sc)}
.rail-nav a.sub{padding-left:14px;font-size:14px;color:var(--tx3)}
.rail-prog{height:6px;background:var(--bg3);border-radius:99px;overflow:hidden}
.rail-prog>i{display:block;height:100%;background:var(--sc);border-radius:99px}
.rail-note{display:block;margin-top:8px;font-size:12.5px;color:var(--tx3)}
.rail .listen{position:static;border:0;padding:0;box-shadow:none;margin:0;background:none}
.rail .listen .lrow{gap:6px}
.rail .listen .lrow .btn{flex:1 1 auto;padding:8px 9px;font-size:12.5px;min-height:36px}
.rail .listen .lrow.small{display:none}
.rail .listen .lstate{margin:8px 0 0;font-size:11.5px}

/* ---------- Prozessgrafik, Vergleich, Struktur ---------- */
.fig{margin:0;border:1px solid var(--line);border-radius:var(--r);padding:22px;background:#fff}
.fig figcaption{margin-top:16px;font-size:14px;line-height:1.6;color:var(--tx3)}
.fig figcaption b{color:var(--tx2)}
.flow-steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:stretch;gap:10px}
.flow-step{flex:1 1 190px;min-width:170px;border:1px solid var(--line);border-radius:var(--r2);
  padding:16px;background:var(--bg2);position:relative}
.flow-step.flow-last{border-color:var(--sc);background:var(--scw)}
.flow-n{display:inline-block;font:700 11.5px/20px var(--f);width:20px;height:20px;border-radius:6px;
  background:var(--sc);color:#fff;text-align:center;margin-bottom:8px}
.flow-step h5{margin:0 0 6px;font-size:16px}
.flow-step p{margin:0;font-size:14px;line-height:1.55;color:var(--tx2)}
.flow-arrow{flex:0 0 auto;align-self:center;display:flex;flex-direction:column;align-items:center;
  color:var(--sc);font:600 12.5px/1.3 var(--f);text-align:center;max-width:96px}
.flow-arrow::before{content:"→";font-size:21px;line-height:1}
.flow-membrane{margin:14px 0 0;padding:10px 14px;border-radius:var(--r2);background:var(--sc);
  color:#fff;font:600 14px/1 var(--f);text-align:center}
.compare{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.cmp-col{border:1px solid var(--line);border-radius:var(--r2);padding:16px;background:var(--bg2)}
.cmp-col h5{margin:0 0 12px;font-size:16px;color:var(--sc)}
.cmp-col dl{margin:0}
.cmp-col dl>div{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.cmp-col dl>div:first-child{border-top:0}
.cmp-col dt{font:700 11.5px/1.5 var(--f);text-transform:uppercase;letter-spacing:.05em;color:var(--tx3)}
.cmp-col dd{margin:0;font-size:14px;line-height:1.5;color:var(--tx2)}
.cmp-note{grid-column:1/-1;margin:0;padding:12px 14px;background:var(--scw);border-radius:var(--r2);
  font-size:14px;line-height:1.55;color:var(--tx2)}
.sfgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.sfcell{border:1px solid var(--line);border-radius:var(--r2);padding:14px;background:var(--bg2)}
.sfcell h5{margin:0 0 6px;font-size:15px;color:var(--sc)}
.sf-why{margin:0 0 6px;font-size:14px;font-weight:600;color:var(--tx)}
.sf-ex{margin:0;font-size:14px;line-height:1.5;color:var(--tx3)}

/* ---------- Mobil ---------- */
@media(max-width:1050px){
  .lesson{grid-template-columns:minmax(0,1fr);gap:var(--s3);max-width:820px}
  .rail{position:static;order:-1}
  .rail-in{flex-direction:row;flex-wrap:wrap;gap:10px}
  .rail-card{flex:1 1 220px;padding:12px}
  .rail-nav{display:none}
  .rail .listen .lrow .btn{font-size:12.5px}
}
@media(max-width:760px){

/* ============================================================
   Ambient-Hintergrund, eine Implementierung
   ============================================================ */
#ambient-stage{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  opacity:var(--amb,.5);transition:opacity .8s ease}
body>.top,body>.nav,body>main{position:relative;z-index:1}
.amb-gradients i{position:absolute;display:block;border-radius:50%;filter:blur(70px);opacity:.5}
.amb-gradients .g1{width:52vw;height:52vw;left:-10vw;top:-14vw;background:var(--sc,#5D72FF);
  animation:ambDrift1 46s ease-in-out infinite alternate}
.amb-gradients .g2{width:44vw;height:44vw;right:-8vw;top:18vh;background:var(--amb2,#18BFA5);
  animation:ambDrift2 58s ease-in-out infinite alternate}
.amb-gradients .g3{width:38vw;height:38vw;left:26vw;bottom:-16vw;background:var(--amb3,#B7FF45);
  animation:ambDrift3 52s ease-in-out infinite alternate}
@keyframes ambDrift1{to{transform:translate3d(9vw,7vh,0) scale(1.12)}}
@keyframes ambDrift2{to{transform:translate3d(-8vw,-6vh,0) scale(.92)}}
@keyframes ambDrift3{to{transform:translate3d(6vw,-9vh,0) scale(1.08)}}
.amb-net{position:absolute;inset:0;width:100%;height:100%}
.amb-net .amb-lines line{stroke:var(--sc,#5D72FF);stroke-width:.7;opacity:.16}
.amb-net .amb-dots circle{fill:var(--sc,#5D72FF);opacity:.34;
  animation:ambPulse var(--d,12s) ease-in-out infinite alternate;
  animation-delay:calc(var(--i,0) * -.7s)}
@keyframes ambPulse{to{transform:translate(10px,-14px);opacity:.6}}
.amb-grid{position:absolute;inset:0;opacity:.5;
  background-image:radial-gradient(circle at 1px 1px,rgba(18,25,39,.16) 1px,transparent 0);
  background-size:26px 26px;
  mask-image:radial-gradient(ellipse at 50% 0%,#000,transparent 72%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000,transparent 72%)}

/* Stimmung je Ansicht */
body[data-view="home"]{--amb:.55}
body[data-view="read"]{--amb:.22}
body[data-view="practice"],body[data-view="train"]{--amb:.30}
body[data-view="test"]{--amb:.16;--amb2:#5D72FF;--amb3:#7A61FF}
body[data-view="repeat"],body[data-view="cards"]{--amb:.26;--amb2:#7A61FF;--amb3:#5D72FF}
body[data-view="read"] .amb-grid{mask-image:radial-gradient(ellipse at 50% 40%,transparent 42%,#000 78%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 40%,transparent 42%,#000 78%)}
body[data-view="test"] .amb-gradients i{animation-duration:120s}
body.calm-motion #ambient-stage *{animation:none!important}

.qn.cur{border-color:var(--sc,var(--blue));border-width:2.5px;color:var(--sc,var(--blue))}
.qn.cur.done{color:#fff}
.qn.flag{position:relative}
.qn.flag::after{content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;
  background:var(--amber);border:1.5px solid #fff}
.qnopen{margin-left:auto;font:700 12.5px/1 var(--f);color:var(--tx3)}
.btn.flagged{background:var(--amber-w);border-color:var(--amber);color:var(--amber)}
.arena.workspace{background:#fff;border-radius:20px;padding:24px;border:1px solid var(--line2)}
.arena.workspace .keyhint{display:none}
body[data-view="train"] .arena.workspace ~ *{display:none}

/* ---------- Grafikbeschriftung ---------- */
.labelviz{position:relative;margin-bottom:16px}
.labelviz .viz{margin:0}
.spots{position:absolute;inset:0;pointer-events:none}
.spot{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;width:30px;height:30px;
  border-radius:50%;border:2px solid #fff;background:var(--sc,var(--blue));color:#fff;
  font:700 12.5px/1 var(--f);cursor:pointer;box-shadow:0 2px 8px rgba(15,27,45,.35)}
.spot:hover,.spot:focus{outline:3px solid var(--amber);outline-offset:2px}
.matchrow.focus{outline:2px solid var(--sc,var(--blue));outline-offset:2px}
.spotn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;
  background:var(--sc,var(--blue));color:#fff;font:700 12.5px/1 var(--f);margin-right:9px;vertical-align:middle}

/* ---------- Notfallanzeige bei leerer Ansicht ---------- */
.emptyguard{max-width:var(--col);background:#fff;border:1px solid var(--amber);border-radius:18px;
  padding:26px;box-shadow:var(--sh)}
.emptyguard h2{font-size:21px;margin:0 0 12px}
.emptyguard p{font-size:16px;line-height:1.65;color:var(--tx2);margin:0 0 16px}
.emptyguard .row{margin-bottom:14px}

/* ---------- Diagramm ohne Daten ---------- */
.viz-empty{border-style:dashed}
.viz-emptybox{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:34px 24px}
.viz-emptyic{width:26px;height:26px;color:var(--tx3)}
.viz-emptyic svg{width:100%;height:100%}
.viz-emptybox b{font-size:16px}
.viz-emptybox span{font-size:14px;line-height:1.55;color:var(--tx3);max-width:46ch}
.viz-emptybox .viz-emptycta{margin-top:6px}
.viz-empty~.viz-empty .viz-emptycta{display:none}

/* ---------- Lektionskopf mit echter Einführung ---------- */
.corepx{max-width:var(--col);margin:0 0 var(--s2);padding:14px 18px;border-radius:14px;
  background:var(--scw,var(--blue-w));font-size:16px;line-height:1.6;color:var(--tx)}
.corepx>span{display:block;font:700 11px/1 var(--f);text-transform:uppercase;letter-spacing:.09em;
  color:var(--sc,var(--blue));margin-bottom:7px}
.herometa{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  margin:0 0 var(--s2);padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.herometa dt{font:700 11px/1 var(--f);text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);margin-bottom:6px}
.herometa dd{margin:0;font-size:14px;line-height:1.55;color:var(--tx2)}
.route{max-width:var(--col);margin:0;font-size:14px;color:var(--tx2)}
.route>span{font:700 11px/1 var(--f);text-transform:uppercase;letter-spacing:.07em;
  color:var(--tx3);margin-right:9px}

/* ---------- Aktionen im Lektionskopf ---------- */
.heroacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px}
.heroacts .btn{min-height:44px;padding:0 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.heroacts .btn.go{font-weight:700}
.ic-read{margin-right:7px;font-size:12.5px}
@media(max-width:560px){.heroacts{gap:8px}.heroacts .btn{flex:1 1 auto;min-height:44px;padding:0 12px;font-size:14px;justify-content:center}.heroacts .btn.go{flex:1 1 100%;min-height:52px;font-size:16px}.heroacts .btn.go small{display:none}}

/* ============================================================
   v27: Oberfläche aus dem freigegebenen v26-Entwurf
   ============================================================ */
html{background:var(--canvas)}
body{background:var(--canvas);color:var(--ink);font-family:var(--f)}
h1,h2,h3,h4{letter-spacing:-.032em;font-weight:700}

/* Dunkle Schale, eine Zeile */
.top{background:var(--shell);border-bottom:0;height:var(--shell-h);position:sticky;top:0;z-index:40;
  }
.top-in{max-width:var(--wrap);height:100%;margin:0 auto;padding:0 28px;display:flex;align-items:center;gap:24px}
.logo{color:#fff;font:700 21px/1 var(--f)}
.logo i{width:32px;height:32px;background:transparent;border:0;box-shadow:none;padding:0}
.logo::after{color:rgba(255,255,255,.45)}
.hud{margin-left:auto;gap:10px}
.hud .chip{background:rgba(255,255,255,.09);color:rgba(255,255,255,.8);border:0}
.hud .chip b{color:var(--lime)}
.tab{color:rgba(255,255,255,.62);border-radius:9px;padding:10px 15px;background:transparent;position:relative;
  font:600 14px/1 var(--f)}
.tab:hover{color:#fff;background:rgba(255,255,255,.07)}
.tab[aria-selected="true"]{background:transparent;color:#fff}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:15px;right:15px;bottom:-11px;height:2.5px;
  background:var(--lime);border-radius:2px}
.tab.util{color:rgba(255,255,255,.5)}
main{max-width:var(--wrap);padding:48px 28px 110px}

/* Ambient */
#ambient-stage .amb-gradients i{position:absolute;display:block;border-radius:50%;filter:blur(90px)}
#ambient-stage .g1{width:56vw;height:56vw;left:-16vw;top:-20vw;background:var(--blue);opacity:.18;
  animation:ambDrift1 54s ease-in-out infinite alternate}
#ambient-stage .g2{width:44vw;height:44vw;right:-12vw;top:26vh;background:var(--teal);opacity:.15;
  animation:ambDrift2 66s ease-in-out infinite alternate}
#ambient-stage .g3{display:none}
#ambient-stage .amb-net line{stroke:var(--ink);stroke-width:.6;opacity:.12}
#ambient-stage .amb-net circle{fill:var(--ink);opacity:.2}
#ambient-stage .amb-grid{display:none}

/* Start */
.v27-top{display:grid;grid-template-columns:58fr 42fr;gap:52px;align-items:start;margin-bottom:52px}
.v27-lead h1{font-size:clamp(32px,5vw,32px);line-height:1.04;margin:16px 0 20px;max-width:15ch}
.v27-lead h1 em{font-style:normal;color:var(--blue)}
.v27-lead>p{font-size:18px;line-height:1.6;color:var(--tx2);max-width:46ch}
.v27-paths{margin-top:38px;display:flex;flex-direction:column}
.v27-path{display:grid;grid-template-columns:1fr auto;gap:22px;align-items:center;text-align:left;
  padding:24px 22px 24px 0;border-top:1px solid var(--line);transition:padding .18s,background .18s;width:100%}
.v27-path:last-child{border-bottom:1px solid var(--line)}
.v27-path:hover{padding-left:16px;background:linear-gradient(90deg,rgba(100,116,255,.07),transparent 70%)}
.v27-path h3{font-size:26px;margin-bottom:6px}
.v27-path p{font-size:15px;color:var(--tx2);max-width:42ch}
.v27-path .go{display:inline-flex;gap:7px;margin-top:11px;font:700 14px/1 var(--f);color:var(--blue)}
.v27-p2 h3,.v27-p2 .go{color:var(--teal)}
.v27-p3 h3,.v27-p3 .go{color:var(--violet)}
.v27-today{background:var(--shell);color:#fff;border-radius:24px;padding:30px;position:sticky;top:150px}
.v27-today .eyebrow{color:var(--lime);font:700 11.5px/1 var(--f);letter-spacing:.16em;text-transform:uppercase}
.v27-today h2{font-size:26px;margin:14px 0 6px;color:#fff}
.v27-today .meta{font:600 14px/1 var(--fm);color:rgba(255,255,255,.6);margin-bottom:18px}
.v27-today p{font-size:15px;line-height:1.6;color:rgba(255,255,255,.78)}
.v27-cta{display:inline-flex;align-items:center;gap:9px;margin-top:22px;background:var(--lime);color:#0B1220;
  font:700 15px/1 var(--f);padding:14px 22px;border-radius:99px;border:0}
.v27-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;border-top:1px solid var(--line2);padding-top:24px}
.v27-strip b{display:block;font:700 26px/1 var(--f);letter-spacing:-.04em}
.v27-strip span{font:600 12.5px/1.4 var(--f);color:var(--tx3);display:block;margin-top:6px}

/* Fächer und Kapitel */
.v27-subjects{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.v27-sub{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;
  box-shadow:var(--sh);transition:.16s;width:100%}
.v27-sub:hover{transform:translateY(-2px);box-shadow:var(--shx);border-color:var(--sc)}
.v27-sub .sh{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.v27-sub .sh svg{width:26px;height:26px;color:var(--sc)}
.v27-sub h3{font-size:21px}
.v27-sub .fmt{font:600 12.5px/1 var(--f);color:var(--tx3);margin-left:auto}
.v27-sub p{font-size:14px;line-height:1.55;color:var(--tx2);margin-bottom:16px}
.v27-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.v27-nums b{display:block;font:700 18px/1 var(--f);color:var(--sc)}
.v27-nums span{font:600 11.5px/1.3 var(--f);color:var(--tx3)}
.v27-next{font-size:14px;color:var(--tx2);border-top:1px solid var(--line);padding-top:12px}
.v27-next b{display:block;font-size:14px;color:var(--ink);margin-top:3px}
.v27-jump{position:sticky;top:calc(var(--shell-h) + 52px);z-index:20;display:flex;gap:6px;padding:12px 0;
  background:rgba(243,241,234,.94);backdrop-filter:blur(8px);overflow-x:auto;scrollbar-width:none;
  -ms-overflow-style:none;scroll-snap-type:x mandatory;border-bottom:1px solid var(--line);margin-bottom:22px}
.v27-jump::-webkit-scrollbar{display:none}
.v27-jump button{font:600 12.5px/1 var(--f);color:var(--tx3);padding:9px 14px;border-radius:99px;white-space:nowrap;
  scroll-snap-align:start;border:0;background:transparent}
.v27-jump button.on{background:var(--ink);color:#fff}
.v27-group{margin-bottom:34px}
.v27-group>h3{font-size:14px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3);margin-bottom:14px}
.v27-road{position:relative;padding-left:44px}
.v27-road::before{content:"";position:absolute;left:15px;top:8px;bottom:20px;width:2px;
  background:linear-gradient(var(--sc),rgba(100,116,255,.14))}
.v27-stop{position:relative;padding:0 0 26px;text-align:left;display:block;width:100%;background:none;border:0}
.v27-stop::before{content:"";position:absolute;left:-36px;top:5px;width:16px;height:16px;border-radius:50%;
  background:var(--canvas);border:2.5px solid var(--sc)}
.v27-stop.done::before{background:var(--sc)}
.v27-stop .no{font:700 11.5px/1 var(--fm);color:var(--tx3);letter-spacing:.1em}
.v27-stop h4{font-size:18px;margin:6px 0 7px}
.v27-stop .q{font-size:15px;color:var(--tx2);font-style:italic;max-width:58ch}
.v27-meta{display:flex;gap:18px;align-items:center;margin-top:10px;font:600 12.5px/1 var(--f);color:var(--tx3);flex-wrap:wrap}
.v27-bar{width:96px;height:5px;border-radius:99px;background:rgba(16,23,36,.1);overflow:hidden}
.v27-bar i{display:block;height:100%;background:var(--sc)}
.v27-search{width:100%;max-width:420px;padding:13px 16px;border:1.5px solid var(--line2);border-radius:12px;
  font:400 15px/1 var(--f);background:var(--surface);margin-bottom:20px}

@media(max-width:760px){
  
  .top-in,.nav-in{padding:0 14px}
  .nav{position:fixed;top:auto;bottom:0;left:0;right:0;border-bottom:0;border-top:1px solid rgba(255,255,255,.09);
    padding-bottom:env(safe-area-inset-bottom)}
  .nav-in{justify-content:space-around;padding:6px 4px;gap:0}
  .tab{flex-direction:column;gap:3px;font-size:11px;min-width:54px;padding:7px 5px}
  .tab[aria-selected="true"]::after{display:none}
  .tab[aria-selected="true"]{color:var(--lime)}
  .tab.util{display:none}
  main{padding:24px 16px 96px}
  .v27-top{grid-template-columns:1fr;gap:28px;margin-bottom:34px}
  .v27-today{position:static;padding:24px;border-radius:18px}
  .v27-strip{grid-template-columns:1fr 1fr;gap:16px}
  .v27-subjects{grid-template-columns:1fr}
  .v27-jump{top:var(--shell-h)}
}

/* Schale und Navigation zusammenfuehren, Zurueck-Link freistellen */
.top{border-bottom:1px solid rgba(255,255,255,.07)}
main{padding-top:34px}
.lnk.back{margin-bottom:18px}
@media(max-width:760px){main{padding-top:20px}}

/* ---------- Modusseiten im v26-Aufbau ---------- */
.v27-modes{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:var(--s3)}
.v27-modes.sec{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.v27-mode{display:flex;flex-direction:column;align-items:flex-start;gap:11px;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;cursor:pointer;
  box-shadow:var(--sh);transition:transform .14s,box-shadow .18s,border-color .18s}
.v27-mode:hover{transform:translateY(-2px);box-shadow:var(--shx);border-color:var(--sc)}
.v27-mode.big{min-height:178px;padding:28px}
.v27-mi{display:inline-flex;width:26px;height:26px;color:var(--sc)}
.v27-mi svg{width:100%;height:100%}
.v27-mt b{display:block;font:700 18px/1.2 var(--f);margin-bottom:6px}
.v27-mt span{font-size:14px;line-height:1.55;color:var(--tx2)}
.v27-mm{margin-top:auto;font:700 11.5px/1 var(--f);color:var(--tx3);background:var(--bg2);
  padding:7px 12px;border-radius:99px}
body[data-view="practice"]{--sc:var(--teal);--scw:var(--teal-w)}
body[data-view="test"]{--sc:var(--violet);--scw:var(--violet-w)}
body[data-view="repeat"]{--sc:#7A61FF;--scw:var(--violet-w)}
body[data-view="games"]{--sc:var(--lime)}
.vhead h1{font-size:clamp(26px,4.4vw,32px)}
.modeintro{border-left:3px solid var(--sc)}
.setrow{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--sh)}
.errrow{background:var(--surface)}
.viz{background:var(--surface)}
.qcard,.card{background:var(--surface)}
@media(max-width:760px){.v27-modes,.v27-modes.sec{grid-template-columns:1fr}}

/* Inhalt bleibt unter den klebenden Leisten frei */
html{scroll-padding-top:calc(var(--shell-h) + 62px)}
main{padding-top:44px}
.view>.vhead:first-child,.view>.lnk.back:first-child{margin-top:6px}
@media(max-width:760px){html{scroll-padding-top:calc(var(--shell-h) + 8px)}main{padding-top:22px}}

/* Leisten müssen immer über dem Inhalt liegen */
body>.top{z-index:60}
body>main{z-index:1}

/* Knöpfe dürfen keine Browser-Vorgaben zeigen */
.v27-path,.v27-stop,.v27-sub,.v27-mode,.v27-cta,.v27-jump button,.lnk{
  -webkit-appearance:none;appearance:none;background-color:transparent;border-color:transparent}
.v27-path{border:0;border-top:1px solid var(--line);background:transparent}
.v27-path:last-child{border-bottom:1px solid var(--line)}
.v27-stop{background:transparent;border:0}
.v27-sub{background:var(--surface);border:1px solid var(--line)}
.v27-mode{background:var(--surface);border:1px solid var(--line)}
.v27-cta{background:var(--lime)}
.v27-jump button.on{background:var(--ink)}

/* Kopf und Navigation als eine feste Schale, Platz reserviert */
body>.top{position:fixed;top:0;left:0;right:0;z-index:60;backdrop-filter:none}
body{padding-top:calc(var(--shell-h) + 52px)}
main{padding-top:34px}
html{scroll-padding-top:calc(var(--shell-h) + 64px)}
@media(max-width:760px){
  body>.nav{position:fixed;top:auto;bottom:0;border-top:1px solid rgba(255,255,255,.09)}
  body{padding-top:var(--shell-h)}
  html{scroll-padding-top:calc(var(--shell-h) + 8px)}
}

.navutil{display:flex;gap:4px;align-items:center}
@media(max-width:760px){.navutil{display:none}}

/* Die Leiste bleibt einzeilig */
.top-in{flex-wrap:nowrap;gap:18px;min-width:0}
body>.nav .tab{padding:10px 12px;white-space:nowrap}
.navutil{flex-wrap:nowrap}
.navutil .tab{padding:10px 11px;white-space:nowrap}
.top .hud{flex-wrap:nowrap;min-width:0;overflow:hidden}
.top .hud .chip{white-space:nowrap;padding:5px 10px;font-size:11.5px}
.logo{white-space:nowrap;flex:none}
.logo::after{display:none}
@media(max-width:1340px){.top .hud .chip:nth-child(n+3){display:none}}
@media(max-width:1180px){.navutil .tab span:not(.tab-ic){display:none}.navutil .tab{padding:10px}}
@media(max-width:760px){.top .hud .chip:nth-child(n+2){display:none}}

body>.nav .tab{line-height:1;height:40px;display:inline-flex;align-items:center}

/* Einzige Navigationsregel */
body>.nav{position:static;display:flex;align-items:center;gap:2px;margin:0 auto;padding:0;
  background:none;border:0;box-shadow:none;overflow:visible;flex-wrap:nowrap;height:auto;min-width:0}
@media(max-width:760px){
  body>.nav{position:fixed;left:0;right:0;bottom:0;top:auto;background:var(--shell);
    border-top:1px solid rgba(255,255,255,.1);justify-content:space-around;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));margin:0;z-index:61}
}

body>.nav{margin-left:24px;margin-right:auto}

.top .hud{margin-left:16px;flex:none}

@media(max-width:1100px){.navutil .tab span:not(.tab-ic){display:none}}

body>.nav .nav-in{display:flex;align-items:center;gap:2px;flex-wrap:nowrap;white-space:nowrap}
body>.nav .tab{white-space:nowrap;flex:0 0 auto}

body>.top .top-in{flex-wrap:nowrap;white-space:nowrap}

  body>.nav .tab{padding:10px 11px;font-size:14px}

}

  body>.nav .tab.util{display:none}
}

  .top .top-in{gap:10px;padding:0 14px}

    background:rgba(11,18,32,.97);backdrop-filter:blur(14px);
    border-top:1px solid rgba(255,255,255,.09);padding-bottom:env(safe-area-inset-bottom)}
  body>.nav .nav-in{justify-content:space-around;padding:7px 4px;gap:0;max-width:none}

  body>.nav .tab[aria-selected="true"]::after{display:none}

  body{padding-top:var(--shell-h);padding-bottom:64px}

  body>.nav{top:auto;bottom:0;border-top:1px solid rgba(255,255,255,.09);border-bottom:0}
  body>.nav .nav-in{justify-content:space-around;padding:7px 4px;gap:0}

  body>.nav .tab.util{display:none}

  body>.top .hud .chip:nth-child(n+3){display:none}
