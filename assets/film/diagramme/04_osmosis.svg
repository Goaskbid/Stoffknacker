<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="osmosis-title osmosis-desc" role="img" viewBox="0 0 560 380" style="font-family:Arial,Helvetica,sans-serif;background:#fff"><title id="osmosis-title">Wasser in beide Richtungen, netto nach rechts</title><desc id="osmosis-desc">Zwei Kammern sind durch eine wasserpermeable Membran getrennt. Links zwei, rechts sechs nicht permeable Teilchen in gleichem Volumen. Ein staerkerer Wasserfluss nach rechts und ein kleinerer nach links sind eingezeichnet.</desc><rect fill="#edf6ff" height="210" rx="12" stroke="#172c45" stroke-width="2" width="490" x="35" y="90"></rect><line stroke="#af3a32" stroke-dasharray="10 7" stroke-width="5" x1="280" x2="280" y1="70" y2="316"></line><circle cx="100" cy="140" fill="#2458a6" r="12"></circle><circle cx="180" cy="245" fill="#2458a6" r="12"></circle><circle cx="340" cy="130" fill="#2458a6" r="12"></circle><circle cx="430" cy="145" fill="#2458a6" r="12"></circle><circle cx="370" cy="200" fill="#2458a6" r="12"></circle><circle cx="480" cy="220" fill="#2458a6" r="12"></circle><circle cx="330" cy="260" fill="#2458a6" r="12"></circle><circle cx="440" cy="270" fill="#2458a6" r="12"></circle><text fill="#172c45" font-size="24" text-anchor="middle" x="142" y="45">geringere</text><text fill="#172c45" font-size="22" text-anchor="middle" x="142" y="73">Konzentration</text><text fill="#172c45" font-size="24" text-anchor="middle" x="415" y="45">höhere</text><text fill="#172c45" font-size="22" text-anchor="middle" x="415" y="73">Konzentration</text><line stroke="#087f78" stroke-width="7" x1="180" x2="375" y1="167" y2="167"></line><path d="M362.00,157.00 L378.00,167.00 L362.00,177.00" fill="none" stroke="#087f78" stroke-width="4"></path><line stroke="#526174" stroke-width="3" x1="352" x2="210" y1="204" y2="204"></line><path d="M222.00,194.00 L206.00,204.00 L222.00,214.00" fill="none" stroke="#526174" stroke-width="3"></path><text fill="#172c45" font-size="22" text-anchor="middle" x="280" y="350">Membran: Wasser ja, gelöste Teilchen nein</text></svg>
