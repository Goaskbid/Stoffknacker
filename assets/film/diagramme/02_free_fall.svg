<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="freefall-title freefall-desc" role="img" viewBox="0 0 560 360" style="font-family:Arial,Helvetica,sans-serif;background:#fff"><title id="freefall-title">Am höchsten Punkt ist nur v null</title><desc id="freefall-desc">Die Geschwindigkeit sinkt linear von plus9,81 auf minus9,81 Meter pro Sekunde. Bei t gleich1Sekunde kreuzt sie null; die Beschleunigung bleibt negativ.</desc><line stroke="#172c45" stroke-width="2" x1="90" x2="490" y1="190" y2="190"></line><line stroke="#172c45" stroke-width="2" x1="90" x2="90" y1="325" y2="45"></line><text fill="#172c45" font-size="22" text-anchor="start" x="480" y="174">t / s</text><text fill="#172c45" font-size="22" text-anchor="start" x="18" y="28">v / (m/s)</text><line stroke="#172c45" stroke-width="2" x1="84" x2="96" y1="297.91" y2="297.91"></line><text fill="#172c45" font-size="20" text-anchor="end" x="78" y="304.91">-9,81</text><line stroke="#172c45" stroke-width="2" x1="84" x2="96" y1="190" y2="190"></line><text fill="#172c45" font-size="20" text-anchor="end" x="78" y="197">0</text><line stroke="#172c45" stroke-width="2" x1="84" x2="96" y1="82.08999999999999" y2="82.08999999999999"></line><text fill="#172c45" font-size="20" text-anchor="end" x="78" y="89.08999999999999">9,81</text><line stroke="#172c45" stroke-width="2" x1="90" x2="90" y1="185" y2="195"></line><text fill="#172c45" font-size="21" text-anchor="middle" x="90" y="222">0</text><line stroke="#172c45" stroke-width="2" x1="270" x2="270" y1="185" y2="195"></line><text fill="#172c45" font-size="21" text-anchor="middle" x="270" y="222">1</text><line stroke="#172c45" stroke-width="2" x1="450" x2="450" y1="185" y2="195"></line><text fill="#172c45" font-size="21" text-anchor="middle" x="450" y="222">2</text><path d="M90.00,82.09 L270.00,190.00 L450.00,297.91" fill="none" stroke="#2458a6" stroke-width="4"></path><circle cx="270" cy="190" fill="#af3a32" r="6"></circle><text fill="#172c45" font-size="21" text-anchor="middle" x="270" y="72">v = 0 am Umkehrpunkt</text><text fill="#172c45" font-size="21" text-anchor="middle" x="270" y="103">a bleibt −9,81 m/s²</text></svg>
