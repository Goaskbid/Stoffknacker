<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="integral-sign-title integral-sign-desc" role="img" viewBox="0 0 560 360" style="font-family:Arial,Helvetica,sans-serif;background:#fff"><title id="integral-sign-title">Integral ist nicht dasselbe wie Flächeninhalt</title><desc id="integral-sign-desc">Links liegt ein negatives Dreieck mit Integralbeitrag minus1/2, rechts ein positives mit plus1/2. Beide geometrischen Teilflaechen sind positiv.</desc><line stroke="#172c45" stroke-width="2" x1="65" x2="505" y1="180" y2="180"></line><line stroke="#172c45" stroke-width="2" x1="280" x2="280" y1="320" y2="35"></line><path d="M120.00,180.00 L120.00,290.00 L280.00,180.00 L120.00,180.00" fill="#f9e5e0" stroke="#af3a32" stroke-width="2"></path><path d="M280.00,180.00 L440.00,70.00 L440.00,180.00 L280.00,180.00" fill="#dcefe9" stroke="#087f78" stroke-width="2"></path><path d="M96.00,306.50 L464.00,53.50" fill="none" stroke="#2458a6" stroke-width="4"></path><line stroke="#172c45" stroke-width="2" x1="120" x2="120" y1="176" y2="184"></line><text fill="#172c45" font-size="21" text-anchor="middle" x="120" y="211">-1</text><line stroke="#172c45" stroke-width="2" x1="280" x2="280" y1="176" y2="184"></line><text fill="#172c45" font-size="21" text-anchor="middle" x="280" y="211">0</text><line stroke="#172c45" stroke-width="2" x1="440" x2="440" y1="176" y2="184"></line><text fill="#172c45" font-size="21" text-anchor="middle" x="440" y="211">1</text><text fill="#172c45" font-size="22" text-anchor="start" x="500" y="166">x</text><text fill="#172c45" font-size="22" text-anchor="start" x="294" y="46">f(x)</text><text fill="#172c45" font-size="24" text-anchor="start" x="380" y="46">f(x) = x</text><text fill="#af3a32" font-size="26" text-anchor="start" x="138" y="267">−1/2</text><text fill="#087f78" font-size="26" text-anchor="start" x="365" y="140">+1/2</text></svg>
