<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="mendel-title mendel-desc" role="img" viewBox="0 0 560 380" style="font-family:Arial,Helvetica,sans-serif;background:#fff"><title id="mendel-title">Vier Kombinationen, keine vier vorgeschriebenen Kinder</title><desc id="mendel-desc">Jeder Elternteil liefert Aoder a mit Wahrscheinlichkeit einhalb. Die vier Kombinationen haben je einViertel Wahrscheinlichkeit. Aa und aAwerden zusammengefasst.</desc><text fill="#172c45" font-size="28" text-anchor="middle" x="280" y="37">Aa × Aa</text><text fill="#172c45" font-size="28" text-anchor="middle" x="265" y="90">A</text><text fill="#172c45" font-size="28" text-anchor="middle" x="405" y="90">a</text><text fill="#172c45" font-size="28" text-anchor="middle" x="122" y="173">A</text><text fill="#172c45" font-size="28" text-anchor="middle" x="122" y="273">a</text><rect fill="#f1f5fa" height="100" stroke="#526174" width="140" x="195" y="110"></rect><text fill="#172c45" font-size="27" text-anchor="middle" x="265" y="151">AA</text><text fill="#172c45" font-size="22" text-anchor="middle" x="265" y="186">1/4</text><rect fill="#f1f5fa" height="100" stroke="#526174" width="140" x="335" y="110"></rect><text fill="#172c45" font-size="27" text-anchor="middle" x="405" y="151">Aa</text><text fill="#172c45" font-size="22" text-anchor="middle" x="405" y="186">1/4</text><rect fill="#f1f5fa" height="100" stroke="#526174" width="140" x="195" y="210"></rect><text fill="#172c45" font-size="27" text-anchor="middle" x="265" y="251">aA</text><text fill="#172c45" font-size="22" text-anchor="middle" x="265" y="286">1/4</text><rect fill="#edf6f1" height="100" stroke="#526174" width="140" x="335" y="210"></rect><text fill="#172c45" font-size="27" text-anchor="middle" x="405" y="251">aa</text><text fill="#172c45" font-size="22" text-anchor="middle" x="405" y="286">1/4</text><text fill="#172c45" font-size="22" text-anchor="middle" x="280" y="350">Aa und aA: derselbe Genotyp</text></svg>
