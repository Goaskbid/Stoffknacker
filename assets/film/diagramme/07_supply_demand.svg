<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="market-title market-desc" role="img" viewBox="0 0 560 375" style="font-family:Arial,Helvetica,sans-serif;background:#fff"><title id="market-title">Eine Verschiebung der Nachfrage</title><desc id="market-desc">Eine steigende Angebotsgerade und zwei parallele fallende Nachfragegeraden. Der Schnittpunkt wechselt von Menge20Preis20 auf Menge25Preis25. Die Nachfrage verschiebt sich, auf dem Angebot bewegt sich der Punkt.</desc><line stroke="#172c45" stroke-width="2" x1="75" x2="510" y1="320" y2="320"></line><line stroke="#172c45" stroke-width="2" x1="75" x2="75" y1="320" y2="35"></line><text fill="#172c45" font-size="23" text-anchor="start" x="490" y="351">Q</text><text fill="#172c45" font-size="23" text-anchor="start" x="26" y="34">P</text><text fill="#172c45" font-size="19" text-anchor="middle" x="75" y="345">0</text><text fill="#172c45" font-size="19" text-anchor="end" x="62" y="326">0</text><text fill="#172c45" font-size="19" text-anchor="middle" x="155" y="345">10</text><text fill="#172c45" font-size="19" text-anchor="end" x="62" y="276">10</text><text fill="#172c45" font-size="19" text-anchor="middle" x="235" y="345">20</text><text fill="#172c45" font-size="19" text-anchor="end" x="62" y="226">20</text><text fill="#172c45" font-size="19" text-anchor="middle" x="315" y="345">30</text><text fill="#172c45" font-size="19" text-anchor="end" x="62" y="176">30</text><text fill="#172c45" font-size="19" text-anchor="middle" x="395" y="345">40</text><text fill="#172c45" font-size="19" text-anchor="end" x="62" y="126">40</text><text fill="#172c45" font-size="19" text-anchor="middle" x="475" y="345">50</text><text fill="#172c45" font-size="19" text-anchor="end" x="62" y="76">50</text><path d="M75.00,320.00 L475.00,70.00" fill="none" stroke="#2458a6" stroke-width="4"></path><path d="M75.00,120.00 L395.00,320.00" fill="none" stroke="#526174" stroke-width="3"></path><path d="M75.00,70.00 L475.00,320.00" fill="none" stroke="