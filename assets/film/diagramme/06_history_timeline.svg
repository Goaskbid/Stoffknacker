<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="history-timeline-title history-timeline-desc" role="img" viewBox="0 0 560 470" style="font-family:Arial,Helvetica,sans-serif;background:#fff"><title id="history-timeline-title">Eine Lagebeschreibung braucht ein Datum</title><desc id="history-timeline-desc">1939Krieg beginnt. Juni1940weitgehend umschlossen. November1942vollstaendig umschlossen. August1944oeffnet sich ein westlicher Zugang.</desc><line stroke="#526174" stroke-width="4" x1="115" x2="115" y1="40" y2="465"></line><circle cx="115" cy="55" fill="#2458a6" r="8"></circle><text fill="#172c45" font-size="24" text-anchor="start" x="140" y="53">1939</text><text fill="#172c45" font-size="21" text-anchor="start" x="140" y="81">Krieg beginnt</text><text fill="#526174" font-size="17" text-anchor="start" x="140" y="109">Noch keine vollständige Umschliessung.</text><circle cx="115" cy="165" fill="#2458a6" r="8"></circle><text fill="#172c45" font-size="24" text-anchor="start" x="140" y="163">Juni 1940</text><text fill="#172c45" font-size="21" text-anchor="start" x="140" y="191">Lage verschärft sich</text><text fill="#526174" font-size="17" text-anchor="start" x="140" y="219">Schweiz weitgehend umschlossen.</text><circle cx="115" cy="275" fill="#2458a6" r="8"></circle><text fill="#172c45" font-size="24" text-anchor="start" x="140" y="273">November 1942</text><text fill="#172c45" font-size="21" text-anchor="start" x="140" y="301">Südfrankreich besetzt</text><text fill="#526174" font-size="17" text-anchor="start" x="140" y="329">Umschliessung vollständig.</text><circle cx="115" cy="385" fill="#2458a6" r="8"></circle><text fill="#172c45" font-size="24" text-anchor="start" x="140" y="383">August 1944</text><text fill="#172c45" font-size="21" text-anchor="start" x="140" y="411">Westlicher Zugang öffnet sich</text><text fill="#526174" font-size="17" text-anchor="start" x="140" y="439">Kriegsverlauf verändert die Lage.</text></svg>
