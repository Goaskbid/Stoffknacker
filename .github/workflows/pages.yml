name: Pages veroeffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.d2.outputs.page_url || steps.d1.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Nur genutzte Dateien veroeffentlichen
        run: |
          rm -f assets/js/app-[0-4][0-9].js
          rm -f "index - "*.html
          rm -rf tools .github
          du -sh . && find . -path ./.git -prune -o -type f -print | wc -l
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: d1
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 1800000
      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
